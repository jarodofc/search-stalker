name: Validate LUMEN

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate API syntax
        run: |
          node --check api/_utils.js
          node --check api/intel.js
          node --check api/proxy.js
          node --check api/scrape.js
          node --check assets/js/worker-forensics.js
      - name: Run security regression tests
        run: npm run check
