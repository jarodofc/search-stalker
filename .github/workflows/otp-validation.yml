name: Telegram OTP validation
on:
  push:
    branches: ['security/telegram-otp']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --input-type=module --check < middleware.js
      - run: node --test tests/otp.test.mjs
