<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API REST Brasil - APIs Públicas</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<style>
:root {
  --elev-1: 0 1px 2px rgba(0,0,0,.30), 0 1px 3px 1px rgba(0,0,0,.15);
  --elev-2: 0 1px 2px rgba(0,0,0,.30), 0 2px 6px 2px rgba(0,0,0,.15);
  --elev-3: 0 4px 8px 3px rgba(0,0,0,.15), 0 1px 3px rgba(0,0,0,.30);
  --ease-std: cubic-bezier(.2,0,0,1);
  --ease-emph: cubic-bezier(.05,.7,.1,1);
  --dur-s: 150ms; --dur-m: 250ms; --dur-l: 350ms; --dur-xl: 500ms;
}
body.theme-dark {
  --bg-0: #0a0f1e; --surface: rgba(30,41,59,.55); --surface-hi: rgba(51,65,85,.55);
  --surface-max: #1e293b; --border: rgba(148,163,184,.12); --border-hi: rgba(148,163,184,.22);
  --text-1: #f1f5f9; --text-2: #cbd5e1; --text-3: #94a3b8;
  --state-hover: rgba(255,255,255,.06); --state-press: rgba(255,255,255,.10);
  --input-bg: rgba(255,255,255,.04);
}
body.theme-light {
  --bg-0: #f4f6fb; --surface: rgba(255,255,255,.85); --surface-hi: rgba(241,245,249,.95);
  --surface-max: #ffffff; --border: rgba(15,23,42,.08); --border-hi: rgba(15,23,42,.16);
  --text-1: #0f172a; --text-2: #334155; --text-3: #64748b;
  --state-hover: rgba(15,23,42,.04); --state-press: rgba(15,23,42,.08);
  --input-bg: rgba(255,255,255,1);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg-0); color: var(--text-1); margin: 0; min-height: 100vh;
  transition: background-color var(--dur-m) var(--ease-std), color var(--dur-m) var(--ease-std);
}
body.theme-dark { background: radial-gradient(1200px 600px at 10% 0%, rgba(34,197,94,.06), transparent 60%), #0a0f1e; }
body.theme-light { background: radial-gradient(1200px 600px at 10% 0%, rgba(34,197,94,.08), transparent 60%), #f4f6fb; }

.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; user-select: none; font-size: 1.25rem; line-height: 1; vertical-align: middle; }
.icon-sm { font-size: 1rem; } .icon-lg { font-size: 1.5rem; } .icon-xl { font-size: 2rem; } .icon-2xl { font-size: 2.5rem; }
.icon-fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

.text-1 { color: var(--text-1); } .text-2 { color: var(--text-2); } .text-3 { color: var(--text-3); }
.border-default { border-color: var(--border); } .border-hi { border-color: var(--border-hi); }
:focus-visible { outline: 2px solid #22c55e; outline-offset: 2px; border-radius: 4px; }

.ripple-host { position: relative; overflow: hidden; isolation: isolate; }
.ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: .25; transform: scale(0); animation: rippleOut var(--dur-xl) var(--ease-std) forwards; pointer-events: none; z-index: 0; }
@keyframes rippleOut { to { transform: scale(2.6); opacity: 0; } }

.lift { transition: transform var(--dur-m) var(--ease-emph), box-shadow var(--dur-m) var(--ease-emph), background-color var(--dur-s) var(--ease-std), border-color var(--dur-s) var(--ease-std); will-change: transform; }
.lift:hover { transform: translateY(-2px); box-shadow: var(--elev-3); }
.lift:active { transform: translateY(0); box-shadow: var(--elev-1); }

.view-enter { animation: viewEnter var(--dur-l) var(--ease-emph) both; }
@keyframes viewEnter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.stagger-item { opacity: 0; animation: staggerIn var(--dur-l) var(--ease-emph) forwards; }
@keyframes staggerIn { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

.skeleton { background: linear-gradient(90deg, rgba(148,163,184,.06) 25%, rgba(148,163,184,.14) 50%, rgba(148,163,184,.06) 75%); background-size: 200% 100%; animation: shimmer 1.4s var(--ease-std) infinite; border-radius: 8px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); transition: background-color var(--dur-s) var(--ease-std), border-color var(--dur-s) var(--ease-std); }

.btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: .75rem 1.5rem; background: #22c55e; color: #0a0f1e; font-weight: 600; font-size: .9375rem; border: none; border-radius: 9999px; cursor: pointer; transition: background-color var(--dur-s) var(--ease-std), box-shadow var(--dur-s) var(--ease-std), transform var(--dur-s) var(--ease-std); }
.btn-primary:hover { background: #16a34a; box-shadow: var(--elev-2); }
.btn-primary:active { transform: scale(.98); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }

.btn-ghost { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: .5rem 1rem; background: transparent; color: var(--text-2); border: 1px solid var(--border); border-radius: 9999px; font-size: .875rem; font-weight: 500; cursor: pointer; transition: background var(--dur-s) var(--ease-std), border-color var(--dur-s) var(--ease-std), color var(--dur-s) var(--ease-std); }
.btn-ghost:hover { background: var(--state-hover); border-color: var(--border-hi); color: var(--text-1); }

.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; background: transparent; border: none; border-radius: 50%; color: var(--text-2); cursor: pointer; transition: background var(--dur-s) var(--ease-std), color var(--dur-s) var(--ease-std); }
.icon-btn:hover { background: var(--state-hover); color: var(--text-1); }

.md-field { position: relative; margin-bottom: 1rem; }
.md-field input, .md-field select { width: 100%; padding: 1rem .875rem .5rem; background: var(--input-bg); border: 1px solid var(--border-hi); border-radius: 8px; color: var(--text-1); font-size: .9375rem; transition: border-color var(--dur-s) var(--ease-std); }
.md-field input::placeholder { color: transparent; }
.md-field input:focus, .md-field select:focus { outline: none; border-color: #22c55e; border-width: 2px; padding: calc(1rem - 1px) calc(.875rem - 1px) calc(.5rem - 1px); }
.md-field label { position: absolute; left: .875rem; top: 50%; transform: translateY(-50%); font-size: .9375rem; color: var(--text-3); pointer-events: none; padding: 0 .25rem; transition: top var(--dur-s) var(--ease-std), font-size var(--dur-s) var(--ease-std), color var(--dur-s) var(--ease-std), background var(--dur-s) var(--ease-std); }
.md-field input:focus + label, .md-field input:not(:placeholder-shown) + label, .md-field select:focus + label, .md-field select:not([value=""]) + label { top: 0; font-size: .75rem; background: var(--surface-max); color: #22c55e; }
.md-field select { appearance: none; cursor: pointer; }
.md-field .chevron { position: absolute; right: .75rem; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; font-size: 1.25rem; }
.md-field select option { background: var(--surface-max); color: var(--text-1); }
.hint { font-size: .75rem; color: var(--text-3); margin-top: .375rem; }

.nav-item { display: flex; align-items: center; gap: .5rem; padding: .5rem .625rem; border-radius: 8px; color: var(--text-3); text-decoration: none; font-size: .8125rem; transition: background var(--dur-s) var(--ease-std), color var(--dur-s) var(--ease-std); position: relative; }
.nav-item:hover { background: var(--state-hover); color: var(--text-1); }
.nav-item.active { background: rgba(34,197,94,.14); color: #22c55e; font-weight: 500; }
.nav-item.active::before { content: ''; position: absolute; left: 0; top: 25%; bottom: 25%; width: 3px; background: #22c55e; border-radius: 0 3px 3px 0; }
.nav-bullet { width: 4px; height: 4px; border-radius: 50%; background: var(--text-3); flex-shrink: 0; transition: background var(--dur-s) var(--ease-std); }
.nav-item.active .nav-bullet { background: #22c55e; }

#sidebar { transition: transform var(--dur-l) var(--ease-emph); }
#sidebar-overlay { opacity: 0; visibility: hidden; transition: opacity var(--dur-m) var(--ease-std), visibility var(--dur-m) var(--ease-std); backdrop-filter: blur(2px); }
#sidebar-overlay.visible { opacity: 1; visibility: visible; }
#header { transition: box-shadow var(--dur-m) var(--ease-std); }
#header.scrolled { box-shadow: var(--elev-2); }

#analiticModal { display: flex; opacity: 0; visibility: hidden; transition: opacity var(--dur-m) var(--ease-std), visibility var(--dur-m) var(--ease-std); align-items: center; justify-content: center; padding: 1rem; background: rgba(2,6,23,.7); backdrop-filter: blur(6px); }
#analiticModal.open { opacity: 1; visibility: visible; }
#analiticModal .modal-content { transform: scale(.96) translateY(12px); opacity: 0; transition: transform var(--dur-l) var(--ease-emph), opacity var(--dur-l) var(--ease-std); }
#analiticModal.open .modal-content { transform: scale(1) translateY(0); opacity: 1; }

.search-wrap { position: relative; }
.search-wrap .material-symbols-outlined { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
.search-input { width: 100%; padding: .875rem 1rem .875rem 3rem; background: var(--surface); border: 1px solid var(--border); border-radius: 9999px; color: var(--text-1); font-size: .9375rem; transition: border-color var(--dur-s) var(--ease-std); }
.search-input:focus { outline: none; border-color: #22c55e; }
.search-input::placeholder { color: var(--text-3); }

.empty-state { text-align: center; padding: 3rem 1.5rem; }
.empty-state .material-symbols-outlined { color: var(--text-3); opacity: .6; margin-bottom: 1rem; }

#progressBar { position: fixed; top: 0; left: 0; height: 3px; background: #22c55e; width: 0; z-index: 9999; transition: width var(--dur-m) var(--ease-std), opacity var(--dur-m) var(--ease-std); opacity: 0; box-shadow: 0 0 8px #22c55e; }
#progressBar.active { opacity: 1; }

.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.status-dot.online { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
.status-dot.offline { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
.status-dot.checking { background: #f59e0b; animation: pulseStatus 1s infinite; }
@keyframes pulseStatus { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

.result-table { width: 100%; border-collapse: collapse; font-size: .8125rem; }
.result-table th, .result-table td { padding: .5rem .625rem; text-align: left; border-bottom: 1px solid var(--border); }
.result-table th { color: var(--text-3); font-weight: 500; font-size: .75rem; text-transform: uppercase; letter-spacing: .025em; }
.result-table tr:last-child td { border-bottom: none; }
.result-table tr:hover td { background: var(--state-hover); }

.kv-row { display: flex; justify-content: space-between; padding: .5rem 0; border-bottom: 1px solid var(--border); font-size: .875rem; gap: 1rem; }
.kv-row:last-child { border-bottom: none; }
.kv-key { color: var(--text-3); }
.kv-val { color: var(--text-1); font-weight: 500; text-align: right; word-break: break-word; }

.banner-warn { display: flex; align-items: flex-start; gap: .75rem; padding: .875rem 1rem; border-radius: 12px; background: rgba(251,146,60,.1); border: 1px solid rgba(251,146,60,.3); color: #fb923c; }
.banner-err { display: flex; align-items: flex-start; gap: .75rem; padding: .875rem 1rem; border-radius: 12px; background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: #f87171; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  .lift:hover { transform: none; }
}
@media print {
  body > *:not(#analiticModal) { display: none !important; }
  #analiticModal { display: block !important; position: static; opacity: 1; visibility: visible; background: #fff; padding: 0; backdrop-filter: none; }
  #analiticModal .modal-content { max-width: 100%; max-height: none; box-shadow: none; transform: none !important; opacity: 1 !important; }
  #analiticModal .modal-header button { display: none !important; }
  #analiticModal .modal-body { max-height: none; overflow: visible; }
  #analiticModal, #analiticModal * { color: #000 !important; background: #fff !important; }
}
</style>
</head>
<body class="theme-dark min-h-screen">
<script>
(function(){ var t = localStorage.getItem('theme') || 'dark'; document.body.classList.remove('theme-dark','theme-light'); document.body.classList.add('theme-' + t); })();
</script>

<div id="progressBar"></div>

<div class="flex">
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-[60] w-64 backdrop-blur-md border-r -translate-x-full lg:translate-x-0" style="background: var(--surface); border-color: var(--border);">
    <div class="flex flex-col h-full">
      <div class="flex items-center justify-between p-3 border-b lg:hidden" style="border-color: var(--border);">
        <div class="flex items-center gap-2">
          <img src="https://www.apii.rest/imagens/logo.png" alt="" class="w-8 h-8 object-contain">

          <div class="flex items-center justify-center gap-1.5 mb-2">

<script>
/* ============================================================
   CONFIG — chaves opcionais
   ============================================================ */
const CONFIG = {
  provider: 'public',
  keys: {
    cpfhub: '',        // https://cpfhub.io
    feriadosapi: ''    // https://feriadosapi.com
  }
};

/* ============================================================
   MÓDULOS — APIs do repositório public-apis
   ============================================================ */
const MODULES = [
  // -------- EMPRESAS (CNPJ) --------
  {
    id: 'cnpj_brasilapi', title: 'CNPJ (BrasilAPI)', desc: 'Empresa por CNPJ via BrasilAPI',
    icon: 'domain', category: 'Empresas',
    endpoints: ['https://brasilapi.com.br/api/cnpj/v1/{cnpj}'],
    inputs: [{ key: 'cnpj', label: 'CNPJ', placeholder: '00000000000000', maxlength: 14, digits: true, validate: v => v.length === 14 || 'CNPJ deve ter 14 dígitos' }]
  },
  {
    id: 'cnpj_receitaws', title: 'CNPJ (Receita WS)', desc: 'Fallback via Receita WS',
    icon: 'domain', category: 'Empresas',
    endpoints: ['https://receitaws.com.br/v1/cnpj/{cnpj}'],
    inputs: [{ key: 'cnpj', label: 'CNPJ', placeholder: '00000000000000', maxlength: 14, digits: true, validate: v => v.length === 14 || 'CNPJ deve ter 14 dígitos' }]
  },
  {
    id: 'cnpj_ws', title: 'CNPJ (CNPJ.ws)', desc: 'Fallback via CNPJ.ws (3 req/min)',
    icon: 'domain', category: 'Empresas',
    endpoints: ['https://publica.cnpj.ws/cnpj/{cnpj}'],
    inputs: [{ key: 'cnpj', label: 'CNPJ', placeholder: '00000000000000', maxlength: 14, digits: true, validate: v => v.length === 14 || 'CNPJ deve ter 14 dígitos' }]
  },

  // -------- LOCALIZAÇÃO --------
  {
    id: 'cep', title: 'Consulta CEP', desc: 'BrasilAPI → ViaCEP (fallback)',
    icon: 'location_on', category: 'Localização',
    endpoints: ['https://brasilapi.com.br/api/cep/v2/{cep}', 'https://viacep.com.br/ws/{cep}/json/'],
    inputs: [{ key: 'cep', label: 'CEP', placeholder: '01310100', maxlength: 8, digits: true, validate: v => v.length === 8 || 'CEP deve ter 8 dígitos' }]
  },
  {
    id: 'ddd', title: 'Consulta DDD', desc: 'Estado e cidades por DDD',
    icon: 'phone_in_talk', category: 'Localização',
    endpoints: ['https://brasilapi.com.br/api/ddd/v1/{ddd}'],
    inputs: [{ key: 'ddd', label: 'DDD', placeholder: '11', maxlength: 2, digits: true, validate: v => v.length === 2 || 'DDD deve ter 2 dígitos' }]
  },
  {
    id: 'estados_ibge', title: 'Estados (IBGE)', desc: 'Lista de estados brasileiros',
    icon: 'map', category: 'Localização',
    endpoints: ['https://servicodados.ibge.gov.br/api/v1/localidades/estados'],
    inputs: []
  },
  {
    id: 'municipios_ibge', title: 'Municípios (IBGE)', desc: 'Municípios por UF',
    icon: 'location_city', category: 'Localização',
    endpoints: ['https://servicodados.ibge.gov.br/api/v1/localidades/estados/{uf}/municipios'],
    inputs: [{ key: 'uf', label: 'UF', placeholder: 'SP', maxlength: 2, validate: v => v.length === 2 || 'UF deve ter 2 letras' }]
  },

  // -------- FERIADOS --------
  {
    id: 'feriados', title: 'Feriados Nacionais', desc: 'Feriados por ano (BrasilAPI)',
    icon: 'event', category: 'Feriados',
    endpoints: ['https://brasilapi.com.br/api/feriados/v1/{ano}'],
    inputs: [{ key: 'ano', label: 'Ano', placeholder: '2025', maxlength: 4, digits: true, validate: v => /^\d{4}$/.test(v) || 'Ano inválido' }]
  },
  {
    id: 'feriados_api', title: 'Feriados API', desc: 'Nacionais, estaduais e municipais (chave)',
    icon: 'event', category: 'Feriados',
    endpoints: ['https://feriadosapi.com/api/v1/feriados/nacionais/{ano}'],
    requiresKey: 'feriadosapi',
    inputs: [{ key: 'ano', label: 'Ano', placeholder: '2025', maxlength: 4, digits: true, validate: v => /^\d{4}$/.test(v) || 'Ano inválido' }]
  },

/* ============================================================
   API
   ============================================================ */
async function tryEndpoints(endpoints, query, key) {
  const errors = [];
  for (const ep of endpoints) {
    const url = ep.replace(/\{(\w+)\}/g, (_, k) => encodeURIComponent(query[k] || ''));
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 12000);
      const headers = { 'Accept': 'application/json' };
      if (key) headers['x-api-key'] = key;
      const res = await fetch(url, { headers, signal: controller.signal });
      clearTimeout(timeout);
      if (!res.ok) {
        if (res.status === 429) errors.push(`${new URL(ep).host} → limite de requisições (429)`);
        else errors.push(`${new URL(ep).host} → HTTP ${res.status}`);
        continue;
      }
      const data = await res.json();
      if (data && data.erro === true) { errors.push(`${new URL(ep).host} → não encontrado`); continue; }
      return { success: true, data, source: new URL(ep).host };
    } catch (e) {
      const host = (() => { try { return new URL(ep).host; } catch { return ep; } })();
      if (e.name === 'AbortError') errors.push(`${host} → timeout`);
      else if (String(e.message).toLowerCase().includes('fetch')) errors.push(`${host} → bloqueado (CORS)`);
      else errors.push(`${host} → ${e.message}`);
    }
  }
  return { success: false, error: 'Todas as tentativas falharam:\n' + errors.join('\n') };
}

async function consultaAPI(mod, query) {
  if (mod.requiresKey) {
    const key = CONFIG.keys[mod.requiresKey];
    if (!key) return { success: false, error: `Este módulo requer a chave "${mod.requiresKey}". Configure em CONFIG.keys.` };
    return tryEndpoints(mod.endpoints, query, key);
  }
  return tryEndpoints(mod.endpoints, query);
}

/* ============================================================
   UTILS
   ============================================================ */
function escapeHtml(v) {
  return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function attachRipple(el) {
  if (!el || el.dataset.ripple === '1') return;
  el.dataset.ripple = '1'; el.classList.add('ripple-host');
  el.addEventListener('pointerdown', e => {
    const rect = el.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 1.2;
    el.appendChild(Object.assign(document.createElement('span'), {
      className: 'ripple',
      style: `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px;`
    }));
    setTimeout(() => el.lastElementChild?.remove(), 550);
  });
}
function attachRipplesTo(root) {
  (root || document).querySelectorAll('button, .btn-primary, .btn-ghost, .ripple-target').forEach(attachRipple);
}
function progressBar(active) {
  const bar = document.getElementById('progressBar');
  if (active) { bar.classList.add('active'); bar.style.width = '70%'; }
  else { bar.style.width = '100%'; setTimeout(() => { bar.classList.remove('active'); bar.style.width = '0'; }, 350); }
}
function fmt(v) {
  if (v === null || v === undefined) return '—';
  if (typeof v === 'boolean') return v ? 'Sim' : 'Não';
  if (Array.isArray(v)) return v.length + ' item(s)';
  if (typeof v === 'object') return '{...}';
  return String(v);
}
function prettifyKey(k) {
  return k.replace(/_/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2').replace(/\b\w/g, c => c.toUpperCase());
}

/* ============================================================

   ============================================================ */
function attachFormHandler(mod) {
  const form = document.getElementById('consultaForm');
  form.querySelectorAll('input[type="text"]').forEach(inp => bindDigitFilter(inp, mod));

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const resultadosDiv = document.getElementById('resultados');
    const query = {};
    const inputsToValidate = mod.inputs || [];

    for (const i of inputsToValidate) {
      const el = document.getElementById('input_' + i.key);
      if (!el) continue;
      const v = el.value.trim();
      if (!v) { alert('Preencha: ' + i.label); el.focus(); return; }
      if (i.validate) {
        const r = i.validate(v);
        if (r !== true) { alert(r); el.focus(); return; }
      }
      query[i.key] = v;
    }

    progressBar(true);
    resultadosDiv.innerHTML = `<div class="card p-5 sm:p-6">
      <div class="flex items-center gap-3 mb-4">
        <div class="skeleton" style="width:40px;height:40px;border-radius:50%;"></div>
        <div class="flex-1"><div class="skeleton mb-2" style="width:50%;height:16px;"></div><div class="skeleton" style="width:30%;height:12px;"></div></div>
      </div>
      <div class="skeleton mb-2" style="height:14px;width:80%;"></div>
      <div class="skeleton mb-2" style="height:14px;width:65%;"></div>
      <div class="skeleton" style="height:14px;width:50%;"></div>
    </div>`;

    try {
      const result = await consultaAPI(mod, query);
      progressBar(false);

      if (!result.success) {
        resultadosDiv.innerHTML = `<div class="card p-5 view-enter" style="border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.06);">
          <div class="flex items-center gap-2 mb-3">
            <span class="material-symbols-outlined" style="color:#f87171;">error</span>
            <h3 class="text-lg font-semibold" style="color:#f87171;">Erro</h3>
          </div>
          <pre class="text-sm whitespace-pre-wrap" style="color:#fca5a5;font-family:inherit;">${escapeHtml(result.error)}</pre>
          <div class="mt-4 text-xs" style="color:var(--text-3);">
            Dica: se estiver abrindo via <code>file://</code>, rode um servidor local (<code>python -m http.server 8000</code>) e acesse por <code>http://localhost</code>.
          </div>
        </div>`;
        return;
      }

      const source = result.source ? ` <span class="text-xs text-3">via ${escapeHtml(result.source)}</span>` : '';
      resultadosDiv.innerHTML = `<div class="card p-5 sm:p-6 view-enter">
        <div class="flex items-center justify-between mb-4 gap-2 flex-wrap">
          <div class="flex items-center gap-2 min-w-0">
            <span class="material-symbols-outlined icon-fill" style="color:#22c55e;">check_circle</span>
            <h3 class="text-lg font-semibold text-1 truncate">Resultado${source}</h3>
          </div>
          <button class="btn-ghost open-modal-btn ripple-target flex-shrink-0" type="button">
            <span class="material-symbols-outlined icon-sm">open_in_new</span>
            <span class="hidden sm:inline">Ver completo</span>
          </button>
        </div>
        <div>${renderPreview(result.data)}</div>
      </div>`;

      resultadosDiv.querySelector('.open-modal-btn').addEventListener('click', () => openModal(result.data));
      attachRipple(resultadosDiv.querySelector('.open-modal-btn'));
      resultadosDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (err) {
      progressBar(false);
      resultadosDiv.innerHTML = `<div class="card p-5" style="border-color:rgba(239,68,68,.4);">
        <p class="text-sm" style="color:#f87171;">Erro inesperado: ${escapeHtml(err.message)}</p>
      </div>`;
    }
  });
}

function bindDigitFilter(inp, mod) {
  inp.addEventListener('input', function() {
    const key = this.id.replace('input_', '');
    const conf = (mod.inputs || []).find(i => i.key === key);
    if (conf && conf.digits) this.value = this.value.replace(/[^0-9]/g, '');
  });
}

/* ============================================================
   PREVIEW
   ============================================================ */
function renderPreview(data) {
  if (data === null || data === undefined) return '<p class="text-3 text-sm">Sem dados</p>';
  if (Array.isArray(data)) {
    if (data.length === 0) return '<p class="text-3 text-sm">Nenhum resultado</p>';
    if (typeof data[0] === 'object' && data[0] !== null) {
      const cols = Object.keys(data[0]).slice(0, 4);
      return `<div class="overflow-x-auto"><table class="result-table">
        <thead><tr>${cols.map(c => `<th>${escapeHtml(prettifyKey(c))}</th>`).join('')}</tr></thead>
        <tbody>${data.slice(0, 8).map(row => `<tr>${cols.map(c => `<td>${escapeHtml(fmt(row[c]))}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>${data.length > 8 ? `<p class="text-xs text-3 mt-2">Mostrando 8 de ${data.length}</p>` : ''}</div>`;
    }
    return `<div class="space-y-1">${data.slice(0, 12).map(v => `<div class="text-sm text-1">• ${escapeHtml(fmt(v))}</div>`).join('')}</div>`;
  }
  if (typeof data === 'object') {
    return Object.keys(data).filter(k => data[k] !== null && data[k] !== undefined).slice(0, 15)
      .map(k => `<div class="kv-row"><span class="kv-key">${escapeHtml(prettifyKey(k))}</span><span class="kv-val">${escapeHtml(fmt(data[k]))}</span></div>`).join('');
  }
  return `<p class="text-1">${escapeHtml(String(data))}</p>`;
}

/* ============================================================
   MODAL
   ============================================================ */
let currentModalData = null;
function openModal(data) {
  currentModalData = data;
  document.getElementById('modalBody').innerHTML = `<pre class="text-xs sm:text-sm leading-relaxed whitespace-pre-wrap break-words" style="font-family:ui-monospace,monospace;color:var(--text-2);">${escapeHtml(JSON.stringify(data, null, 2))}</pre>`;
  document.getElementById('analiticModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('analiticModal').classList.remove('open');
  document.body.style.overflow = '';
}
function bindModalActions() {
  document.getElementById('btnCloseModal').addEventListener('click', closeModal);
  document.getElementById('analiticModal').addEventListener('click', e => { if (e.target.id === 'analiticModal') closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  document.getElementById('btnPrint').addEventListener('click', () => window.print());
  document.getElementById('btnCopy').addEventListener('click', async () => {
    if (!currentModalData) return;
    try {
      await navigator.clipboard.writeText(JSON.stringify(currentModalData, null, 2));
      const b = document.getElementById('btnCopy');
      const o = b.innerHTML;
      b.innerHTML = '<span class="material-symbols-outlined icon-sm" style="color:#22c55e;">check</span>';
      setTimeout(() => b.innerHTML = o, 1200);
    } catch { alert('Não foi possível copiar.'); }
  });
  document.getElementById('btnDownload').addEventListener('click', () => {
    if (!currentModalData) return;
    const blob = new Blob([JSON.stringify(currentModalData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'consulta-' + Date.now() + '.json';
    a.click(); URL.revokeObjectURL(url);
  });
}

/* ============================================================
   CONNECTION
   ============================================================ */
async function checkConnection() {
  const dot = document.getElementById('netStatus');
  const text = document.getElementById('netStatusText');
  const banner = document.getElementById('connBanner');
  if (!dot) return;
  dot.className = 'status-dot checking';
  text.textContent = 'Verificando...';
  try {
    const res = await fetch('https://brasilapi.com.br/api/feriados/v1/2024', {
      headers: { 'Accept': 'application/json' },
      signal: AbortSignal.timeout(8000)
    });
    if (res.ok) {
      dot.className = 'status-dot online';
      text.textContent = 'BrasilAPI online';
      if (banner) banner.innerHTML = '';
    } else throw new Error('HTTP ' + res.status);
  } catch (e) {
    dot.className = 'status-dot offline';
    text.textContent = 'BrasilAPI inacessível';
    if (banner) banner.innerHTML = `<div class="banner-err">
      <span class="material-symbols-outlined icon-sm" style="margin-top:2px;">wifi_off</span>
      <div class="text-sm"><strong>Sem conexão com BrasilAPI.</strong> Se abriu via <code>file://</code>, rode um servidor local: <code>python -m http.server 8000</code>. Motivo: ${escapeHtml(e.message || 'CORS/network')}</div>
    </div>`;
  }
}

/* ============================================================
   ROUTER
   ============================================================ */
function getRoute() {
  let h = location.hash.replace(/^#/, '');
  if (!h || h === '/') return '/';
  if (!h.startsWith('/')) h = '/' + h;
  return h;
}
function render() {
  const route = getRoute();
  progressBar(true);
  if (route === '/') renderDashboard();
  else {
    const mod = MODULES.find(m => m.id === route.slice(1));
    if (!mod) { location.hash = '#/'; return; }
    renderModule(mod);
  }
  renderSidebar();
  attachRipplesTo(document.getElementById('sidebar'));
  window.scrollTo({ top: 0, behavior: 'instant' });
  setTimeout(() => progressBar(false), 200);
}

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  const header = document.getElementById('header');
  window.addEventListener('scroll', () => header.classList.toggle('scrolled', window.scrollY > 4), { passive: true });

  document.getElementById('sidebar-toggle').addEventListener('click', () => toggleSidebar());
  document.getElementById('sidebar-close').addEventListener('click', () => toggleSidebar());
  document.getElementById('sidebar-overlay').addEventListener('click', () => toggleSidebar());

  const themeBtn = document.getElementById('theme-toggle');
  const themeIcon = document.getElementById('themeIcon');
  function syncIcon() { themeIcon.textContent = document.body.classList.contains('theme-dark') ? 'light_mode' : 'dark_mode'; }
  syncIcon();
  themeBtn.addEventListener('click', () => {
    const isDark = document.body.classList.contains('theme-dark');
    document.body.classList.remove('theme-dark', 'theme-light');
    document.body.classList.add(isDark ? 'theme-light' : 'theme-dark');
    localStorage.setItem('theme', isDark ? 'light' : 'dark');
    syncIcon();
  });

  const umBtn = document.getElementById('user-menu-btn');
  const um = document.getElementById('user-menu');
  umBtn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); um.classList.toggle('hidden'); });
  document.addEventListener('click', e => { if (!umBtn.contains(e.target) && !um.contains(e.target)) um.classList.add('hidden'); });

  bindModalActions();
  document.getElementById('apiCount').textContent = MODULES.length;
  render();
  window.addEventListener('hashchange', render);
  window.addEventListener('resize', syncSidebarViewport);
  syncSidebarViewport();
});

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  if (sb.classList.contains('-translate-x-full')) { sb.classList.remove('-translate-x-full'); ov.classList.add('visible'); }
  else { sb.classList.add('-translate-x-full'); ov.classList.remove('visible'); }
}
function syncSidebarViewport() {
  if (window.innerWidth >= 1024) {
    document.getElementById('sidebar').classList.add('-translate-x-full');
    document.getElementById('sidebar-overlay').classList.remove('visible');
  }
}
</script>
