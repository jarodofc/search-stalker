<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" data-solid-panels="false">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="zFORENSE v3.0: Pericia Digital, OSINT e Threat Intelligence em Liquid Glass e Material UX." />
  <title>zFORENSE v3.0 | Gabinete de Pericia Digital &amp; OSINT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Courier+Prime:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <div class="ambient-stage" aria-hidden="true"></div>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <div class="app-shell">
    <div class="rail-wrap">
      <aside class="sidebar liquid-glass-elevated" aria-label="Navegacao de Modulos">
        <div class="brand">
          <div class="brand-seal" id="brand-seal" aria-hidden="true"></div>
          <div>
            <div class="brand-name">zFORENSE</div>
            <div class="brand-sub">CASE 221B • FLORENCE</div>
          </div>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
      </aside>
    </div>

    <div class="main-area">
      <header class="topbar-glass">
        <div class="topbar-left">
          <button type="button" class="icon-btn menu-btn" id="menu-toggle" aria-label="Abrir Menu"></button>
          <button type="button" class="proxy-pill" id="proxy-status" title="Clique para refazer o handshake do proxy remoto">
            <span class="proxy-dot"></span>
            <span id="proxy-label">Conectando...</span>
          </button>
        </div>

        <div class="command-lens" role="search">
          <span id="cmd-icon" aria-hidden="true"></span>
          <input type="search" id="command-input" class="command-input" placeholder="Ir para modulo ou ferramenta..." autocomplete="off" aria-label="Busca rapida de modulos" />
          <span class="kbd-chip">⌘K</span>
          <div class="command-results liquid-glass-elevated" id="command-results"></div>
        </div>

        <div class="topbar-right">
          <button type="button" class="icon-btn" id="solid-toggle" title="Alternar Paineis Solidos (Acessibilidade)">
            <span id="solid-icon"></span>
            <span class="btn-label-hide">Solido</span>
          </button>
          <button type="button" class="icon-btn" id="theme-toggle" title="Alternar Noite em Baker Street / Pergaminho de Florenca">
            <span id="theme-icon"></span>
            <span class="btn-label-hide" id="theme-label">Pergaminho</span>
          </button>
        </div>
      </header>

      <main class="workspace">
        <div class="workspace-header">
          <div class="stamp-chip" id="workspace-stamp">DOSSIE #221B</div>
          <h1 class="workspace-title" id="workspace-title">Carregando gabinete...</h1>
          <p class="workspace-desc" id="workspace-desc"></p>
        </div>
        <div id="workspace-body"></div>
      </main>
    </div>
  </div>

  <nav class="pill-dock" id="pill-dock" aria-label="Acesso rapido mobile"></nav>
  <div class="toast-host" id="toast-host" aria-live="polite"></div>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
