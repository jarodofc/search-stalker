<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Consultas</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
  :root{--bg:#0a0f1e;--card:rgba(30,41,59,.7);--b:rgba(255,255,255,.1);--t1:#f1f5f9;--t2:#94a3b8;--in:rgba(0,0,0,.3)}
  body.light{--bg:#f4f6fb;--card:#fff;--b:#e2e8f0;--t1:#0f172a;--t2:#64748b;--in:#f8fafc}
  *{box-sizing:border-box}body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t1);margin:0;transition:.3s;min-height:100vh}
  .card{background:var(--card);border:1px solid var(--b);border-radius:12px;backdrop-filter:blur(10px)}
  .inp{width:100%;padding:10px 12px;background:var(--in);border:1px solid var(--b);border-radius:8px;color:var(--t1);outline:none;transition:.2s}
  .inp:focus{border-color:#22c55e}
  .btn{background:#22c55e;color:#000;font-weight:600;padding:10px 20px;border-radius:8px;border:none;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn:hover{background:#16a34a}.btn:disabled{opacity:.6;cursor:not-allowed}
  .nav{padding:10px 16px;border-radius:8px;color:var(--t2);cursor:pointer;display:flex;align-items:center;gap:10px;transition:.2s;text-decoration:none}
  .nav:hover{background:rgba(255,255,255,.05);color:var(--t1)}
  .nav.active{background:rgba(34,197,94,.15);color:#22c55e;font-weight:500}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.3s;z-index:99}
  .modal.show{opacity:1;pointer-events:all}
  .modal-content{background:var(--bg);border:1px solid var(--b);border-radius:16px;width:90%;max-width:800px;max-height:90vh;display:flex;flex-direction:column;transform:scale(.95);transition:.3s}
  .modal.show .modal-content{transform:scale(1)}
  .spinner{animation:spin 1s linear infinite}@keyframes spin{100%{transform:rotate(360deg)}}
  .kv-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--b);font-size:14px;gap:16px}
  .kv-key{color:var(--t2);text-transform:capitalize}.kv-val{color:var(--t1);font-weight:500;text-align:right;word-break:break-word}
</style>
</head>
<body>
<div class="flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <aside class="w-64 border-r hidden md:flex flex-col" style="border-color:var(--b);background:var(--card)">
    <div class="p-5 border-b flex items-center gap-3" style="border-color:var(--b)">
      <span class="material-symbols-outlined text-green-500 text-3xl">api</span>
      <span class="font-bold text-lg">API REST</span>
    </div>
    <nav id="nav" class="p-4 flex-1 space-y-2 overflow-y-auto"></nav>
    <div class="p-4 border-t text-center text-xs" style="border-color:var(--b);color:var(--t2)">
      <button onclick="toggleTheme()" class="nav w-full justify-center">Alternar Tema</button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col h-full overflow-hidden relative">
    <header class="p-4 border-b flex justify-between items-center" style="border-color:var(--b)">
      <h1 class="font-semibold text-xl" id="pageTitle">Dashboard</h1>
    </header>
    <div class="p-6 flex-1 overflow-y-auto" id="view"></div>
  </main>
</div>

<!-- Modal para JSON -->
<div class="modal" id="modal">
  <div class="modal-content">
    <div class="p-4 border-b flex justify-between items-center" style="border-color:var(--b)">
      <h2 class="font-semibold">Resultado Completo</h2>
      <button onclick="document.getElementById('modal').classList.remove('show')" class="nav"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div class="p-4 overflow-auto" style="max-height:70vh">
      <pre id="modalBody" class="text-sm" style="color:var(--t2)"></pre>
    </div>
  </div>
</div>

<script>
// ==========================================
// 1. CONFIGURAÇÃO DAS CHAVES (COLOQUE AQUI)
// ==========================================
const CONFIG = {
  cpfKey: '778433e124468b1aa60f2681919cd918f852afe1761056985813881cb72a550f',
  placaKey: 'SUA_CHAVE_DE_PLACA_AQUI', // Substitua pela chave da sua API de Placa
  placaBaseUrl: 'https://api.exemplo.com/v1/placa/' // Substitua pela URL da sua API de Placa
};

// ==========================================
// 2. DEFINIÇÃO DOS MÓDULOS
// ==========================================
const MODULES = [
  { 
    id: 'cnpj', 
    name: 'Consulta CNPJ', 
    icon: 'domain', 
    desc: 'Dados de Empresas (BrasilAPI)',
    placeholder: '00.000.000/0000-00', 
    max: 14, 
    digits: true,
    url: (v) => `https://brasilapi.com.br/api/cnpj/v1/${v.replace(/\D/g,'')}`
  },
  { 
    id: 'cpf', 
    name: 'Consulta CPF', 
    icon: 'person', 
    desc: 'Dados de Pessoas (CPFHub)',
    placeholder: '000.000.000-00', 
    max: 11, 
    digits: true,
    url: (v) => `https://api.cpfhub.io/cpf/${v.replace(/\D/g,'')}`,
    headers: { 'x-api-key': CONFIG.cpfKey }
  },
  { 
    id: 'placa', 
    name: 'Consulta Placa', 
    icon: 'directions_car', 
    desc: 'Dados de Veículos',
    placeholder: 'ABC-1234', 
    max: 7, 
    digits: false,
    url: (v) => `${CONFIG.placaBaseUrl}${v.replace(/[^A-Za-z0-9]/g,'').toUpperCase()}`,
    headers: { 'Authorization': `Bearer ${CONFIG.placaKey}` } // Altere se sua API usar outro header
  }
];

// ==========================================
// 3. LÓGICA E RENDERIZAÇÃO
// ==========================================
function toggleTheme() {
  document.body.classList.toggle('light');
}

function renderNav() {
  const nav = document.getElementById('nav');
  let html = `<a href="#" onclick="navigate('')" class="nav ${!window.location.hash ? 'active' : ''}">
    <span class="material-symbols-outlined">dashboard</span> Dashboard
  </a>`;
  
  MODULES.forEach(m => {
    html += `<a href="#" onclick="navigate('${m.id}')" class="nav ${window.location.hash === '#'+m.id ? 'active' : ''}">
      <span class="material-symbols-outlined">${m.icon}</span> ${m.name}
    </a>`;
  });
  nav.innerHTML = html;
}

function navigate(id) {
  window.location.hash = id ? '#'+id : '';
  render();
}

function render() {
  renderNav();
  const hash = window.location.hash.replace('#', '');
  const view = document.getElementById('view');
  const title = document.getElementById('pageTitle');

  if (!hash) {
    title.innerText = 'Dashboard';
    let cards = MODULES.map(m => `
      <div class="card p-6 cursor-pointer hover:border-green-500 transition" onclick="navigate('${m.id}')">
        <span class="material-symbols-outlined text-4xl text-green-500 mb-4">${m.icon}</span>
        <h3 class="text-xl font-semibold mb-1">${m.name}</h3>
        <p class="text-sm" style="color:var(--t2)">${m.desc}</p>
      </div>
    `).join('');
    view.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-3 gap-6">${cards}</div>`;
  } else {
    const m = MODULES.find(x => x.id === hash);
    if (!m) return navigate('');
    
    title.innerText = m.name;
    view.innerHTML = `
      <div class="max-w-xl">
        <div class="card p-6">
          <div class="flex items-center gap-3 mb-6">
            <div class="p-3 rounded-lg bg-green-500/10 text-green-500">
              <span class="material-symbols-outlined text-3xl">${m.icon}</span>
            </div>
            <div>
              <h2 class="text-xl font-semibold">${m.name}</h2>
              <p class="text-sm" style="color:var(--t2)">${m.desc}</p>
            </div>
          </div>
          
          <form id="searchForm" onsubmit="handleSearch(event, '${m.id}')">
            <label class="block text-sm mb-2" style="color:var(--t2)">Digite o valor para consulta</label>
            <input type="text" id="searchInput" class="inp mb-4" placeholder="${m.placeholder}" maxlength="${m.max}" required>
            <button type="submit" class="btn w-full">
              <span class="material-symbols-outlined">search</span> Consultar
            </button>
          </form>
        </div>
        <div id="result" class="mt-6 hidden"></div>
      </div>
    `;

    if (m.digits) {
      document.getElementById('searchInput').addEventListener('input', function(e) {
        this.value = this.value.replace(/\D/g, '');
      });
    }
  }
}

async function handleSearch(e, id) {
  e.preventDefault();
  const m = MODULES.find(x => x.id === id);
  const val = document.getElementById('searchInput').value.trim();
  const btn = e.target.querySelector('button');
  const resDiv = document.getElementById('result');

  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-outlined spinner">refresh</span> Buscando...';
  resDiv.classList.add('hidden');

  try {
    const url = m.url(val);
    const options = { method: 'GET', headers: m.headers || {} };
    
    // Adiciona um timeout para não travar caso a API demore
    const controller = new AbortController();
    options.signal = controller.signal;
    setTimeout(() => controller.abort(), 15000);

    const response = await fetch(url, options);
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || data.error || `Erro HTTP ${response.status}`);
    }

    resDiv.innerHTML = `
      <div class="card p-6 border-green-500/30">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-semibold text-green-500 flex items-center gap-2">
            <span class="material-symbols-outlined">check_circle</span> Sucesso
          </h3>
          <button onclick="showJson()" class="text-xs text-blue-400 hover:underline">Ver JSON</button>
        </div>
        <div id="formattedResult"></div>
      </div>
    `;
    
    // Formata os dados visualmente (apenas campos de texto simples)
    const formatted = Object.keys(data)
      .filter(k => typeof data[k] !== 'object' || data[k] === null)
      .map(k => `<div class="kv-row"><span class="kv-key">${k.replace(/_/g,' ')}</span><span class="kv-val">${data[k]}</span></div>`)
      .join('');
      
    document.getElementById('formattedResult').innerHTML = formatted || '<p class="text-sm" style="color:var(--t2)">Nenhum dado simples para exibir. Clique em Ver JSON.</p>';
    resDiv.classList.remove('hidden');
    
    // Guarda os dados para o modal
    window._currentJson = data;

  } catch (err) {
    let msg = err.name === 'AbortError' ? 'Tempo limite excedido. A API demorou muito para responder.' : err.message;
    if (msg.includes('Failed to fetch')) {
      msg = 'Falha de conexão. Isso geralmente ocorre por bloqueio de CORS. Se o projeto for particular, use um proxy (como o Vercel) para contornar.';
    }
    
    resDiv.innerHTML = `
      <div class="card p-6 border-red-500/30">
        <h3 class="font-semibold text-red-500 flex items-center gap-2 mb-2">
          <span class="material-symbols-outlined">error</span> Erro na consulta
        </h3>
        <p class="text-sm text-red-400">${msg}</p>
      </div>
    `;
    resDiv.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span class="material-symbols-outlined">search</span> Consultar';
  }
}

function showJson() {
  document.getElementById('modalBody').innerText = JSON.stringify(window._currentJson, null, 2);
  document.getElementById('modal').classList.add('show');
}

// Inicialização
window.addEventListener('hashchange', render);
document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
