<style>
  /* =========================================
     DESIGN TOKENS (Material UX + Liquid Glass)
     ========================================= */
  :root {
    --bg-base: #050508;
    --glass-bg: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-highlight: rgba(255, 255, 255, 0.15);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #0A84FF;
    --accent-glow: rgba(10, 132, 255, 0.4);
    --success: #30D158;
    --danger: #FF453A;
    --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--bg-base);
    color: var(--text-main);
    margin: 0; min-height: 100vh; overflow-x: hidden;
    /* Fundo com gradientes radiais para dar profundidade ao vidro */
    background-image: 
      radial-gradient(circle at 15% 20%, rgba(10, 132, 255, 0.15), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(191, 90, 242, 0.1), transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(48, 209, 88, 0.05), transparent 50%);
    background-attachment: fixed;
  }

  /* =========================================
     LIQUID GLASS (Efeito iOS)
     ========================================= */
  .liquid-glass {
    background: var(--glass-bg);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    box-shadow: 
      0 8px 32px rgba(0, 0, 0, 0.4), 
      inset 0 0 0 1px rgba(255, 255, 255, 0.05),
      inset 0 20px 40px rgba(255, 255, 255, 0.02);
    position: relative;
    overflow: hidden;
    transition: transform 0.3s var(--ease-spring), box-shadow 0.3s ease;
  }

  /* Borda especular (Luz batendo no vidro) */
  .liquid-glass::before {
    content: '';
    position: absolute; inset: 0; border-radius: inherit; padding: 1px;
    background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, transparent 40%, transparent 60%, rgba(255,255,255,0.05) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .liquid-glass.interactive { cursor: pointer; }
  .liquid-glass.interactive:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
  }
  .liquid-glass.interactive:active { transform: scale(0.98); }

  /* =========================================
     FORMULÁRIOS E BOTÕES (Material UX)
     ========================================= */
  .input-group { position: relative; margin-bottom: 24px; }
  .input-glass {
    width: 100%; padding: 18px 16px 12px;
    background: rgba(0, 0, 0, 0.2); border: 1px solid var(--glass-border);
    border-radius: 16px; color: var(--text-main); outline: none;
    font-size: 16px; transition: all 0.2s ease;
  }
  .input-glass:focus { 
    border-color: var(--accent); 
    background: rgba(0, 0, 0, 0.4);
    box-shadow: 0 0 0 4px var(--accent-glow); 
  }
  .input-label {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); font-size: 15px; pointer-events: none;
    transition: all 0.2s ease;
  }
  .input-glass:focus ~ .input-label,
  .input-glass:not(:placeholder-shown) ~ .input-label {
    top: 8px; font-size: 11px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
  }

  .btn-primary {
    background: var(--accent); color: #fff; font-weight: 600; font-size: 16px;
    padding: 16px 24px; border-radius: 16px; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.2s var(--ease-spring);
    position: relative; overflow: hidden;
  }
  .btn-primary::after {
    content: ''; position: absolute; top: 50%; left: 50%; width: 5px; height: 5px;
    background: rgba(255, 255, 255, 0.5); opacity: 0; border-radius: 100%;
    transform: scale(1, 1) translate(-50%);
    transform-origin: 50% 50%;
  }
  .btn-primary:active::after { animation: ripple 0.6s ease-out; }
  @keyframes ripple {
    0% { transform: scale(0, 0); opacity: 0.5; }
    100% { transform: scale(40, 40); opacity: 0; }
  }
  .btn-primary:hover { background: #0070e0; box-shadow: 0 8px 24px var(--accent-glow); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

  /* =========================================
     RESULTADOS
     ========================================= */
  .data-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .data-item {
    display: flex; align-items: flex-start; gap: 16px; padding: 16px;
    background: rgba(255, 255, 255, 0.02); border: 1px solid var(--glass-border);
    border-radius: 16px; transition: background 0.2s;
  }
  .data-item:hover { background: rgba(255, 255, 255, 0.05); }
  .data-icon { color: var(--accent); font-size: 24px; }
  .data-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 600; margin-bottom: 4px; }
  .data-value { font-size: 15px; font-weight: 500; color: var(--text-main); word-break: break-word; }

  /* Loaders */
  .spinner { animation: spin 1s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  
  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-base); }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-6xl mx-auto">
  <!-- Header (Liquid Glass) -->
  <header class="liquid-glass p-4 flex items-center justify-between mb-8 sticky top-4 z-50">
    <div class="flex items-center gap-4 cursor-pointer" onclick="navigate('')">
      <div class="w-12 h-12 rounded-2xl bg-white/10 flex items-center justify-center border border-white/20 shadow-[0_0_20px_rgba(255,255,255,0.1)]">
        <span class="material-symbols-rounded text-3xl">fingerprint</span>
      </div>
      <div>
        <span class="font-bold text-2xl tracking-tight block leading-none">Glass<span class="text-[var(--accent)]">OSINT</span></span>
        <span class="text-xs text-[var(--text-muted)] font-medium tracking-wider uppercase">Intelligence Panel</span>
      </div>
    </div>
  </header>

  <!-- Main View -->
  <main id="view" class="w-full"></main>
</div>

<script>
// ==========================================
// CONFIGURAÇÃO E FALLBACKS
// ==========================================
const CONFIG = {
  cpfKey: '778433e124468b1aa60f2681919cd918f852afe1761056985813881cb72a550f',
  corsProxy: 'https://api.allorigins.win/raw?url='
};

const ICON_MAP = {
  'cnpj': 'badge', 'cpf': 'fingerprint', 'placa': 'directions_car',
  'nome': 'person', 'email': 'mail', 'telefone': 'call', 'celular': 'smartphone',
  'uf': 'map', 'pais': 'public', 'municipio': 'location_city', 'cep': 'markunread_mailbox',
  'logradouro': 'signpost', 'numero': 'numbers', 'bairro': 'holiday_village',
  'data': 'calendar_today', 'nascimento': 'cake', 'abertura': 'event',
  'situacao': 'info', 'status': 'check_circle', 'cnae': 'category', 'natureza': 'gavel',
  'marca': 'local_offer', 'modelo': 'commute', 'ano': 'update', 'cor': 'palette', 'chassi': 'tag',
  'combustivel': 'local_gas_station', 'motor': 'settings', 'brand': 'local_offer', 'model': 'commute',
  'color': 'palette', 'fuel': 'local_gas_station', 'year': 'update', 'city': 'location_city', 'state': 'map',
  'username': 'alternate_email', 'profile': 'account_circle', 'url': 'link', 'repos': 'folder'
};

function getIcon(key) {
  const k = key.toLowerCase();
  for (const [search, icon] of Object.entries(ICON_MAP)) {
    if (k.includes(search)) return icon;
  }
  return 'data_object';
}

async function tryFallback(sources) {
  let lastError;
  for (const source of sources) {
    try {
      const result = await source();
      if (result) return result;
    } catch (e) {
      lastError = e;
      console.warn('Fonte falhou, tentando próxima...', e);
    }
  }
  throw new Error(lastError?.message || 'Todas as fontes de dados falharam.');
}

const MODULES = [
  { 
    id: 'cnpj', name: 'CNPJ', desc: 'Consulta de Empresas', icon: 'domain', placeholder: 'Apenas números', max: 14, digits: true,
    fetchApi: async (v) => {
      const clean = v.replace(/\D/g,'');
      return await tryFallback([
        async () => { const r = await fetch(`https://minhareceita.org/${clean}`); if(!r.ok) throw new Error(); return await r.json(); },
        async () => { const r = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${clean}`); if(!r.ok) throw new Error(); return await r.json(); },
        async () => { const r = await fetch(`https://receitaws.com.br/v1/cnpj/${clean}`); if(!r.ok) throw new Error(); return await r.json(); }
      ]);
    }
  },
  { 
    id: 'cpf', name: 'CPF', desc: 'Consulta de Pessoas', icon: 'fingerprint', placeholder: 'Apenas números', max: 11, digits: true,
    fetchApi: async (v) => {
      const clean = v.replace(/\D/g,'');
      return await tryFallback([
        async () => {
          const r = await fetch(`https://api.cpfhub.io/cpf/${clean}`, { headers: { 'x-api-key': CONFIG.cpfKey, 'Accept': 'application/json' } });
          if(!r.ok) throw new Error();
          const raw = await r.json();
          return raw.data || raw.result || raw;
        },
        async () => { return { aviso: 'API externa indisponível.', cpf: clean, formato_valido: clean.length === 11 }; }
      ]);
    }
  },
  { 
    id: 'placa', name: 'Placa', desc: 'Consulta de Veículos (FIPE)', icon: 'directions_car', placeholder: 'ABC1D23', max: 7, digits: false,
    fetchApi: async (v) => {
      const placa = v.replace(/[^A-Za-z0-9]/g,'').toUpperCase();
      return await tryFallback([
        async () => { const r = await fetch(`https://fipe.parallelum.com.br/api/v2/plates/${placa}`); if(!r.ok) throw new Error(); return await r.json(); },
        async () => { throw new Error('API FIPE indisponível. Tente novamente.'); }
      ]);
    }
  },
  {
    id: 'sherlock', name: 'Sherlock', desc: 'OSINT Username', icon: 'search', placeholder: 'Ex: johndoe', max: 30, digits: false,
    fetchApi: async (v) => {
      const username = v.trim(); const results = [];
      try { const gh = await fetch(`${CONFIG.corsProxy}${encodeURIComponent(`https://api.github.com/users/${username}`)}`); if (gh.ok) { const d = await gh.json(); if (d.login) results.push({ platform: 'GitHub', found: true, url: d.html_url, name: d.name, repos: d.public_repos }); } } catch(e) {}
      try { const rd = await fetch(`${CONFIG.corsProxy}${encodeURIComponent(`https://www.reddit.com/user/${username}/about.json`)}`); if (rd.ok) { const d = await rd.json(); if (d.data && !d.data.error) results.push({ platform: 'Reddit', found: true, url: `https://reddit.com/user/${username}`, name: d.data.name, karma: d.data.link_karma }); } } catch(e) {}
      if (results.length === 0) return { message: `Nenhum perfil encontrado para "${username}".`, checked: ['GitHub', 'Reddit'] };
      return { username: username, profiles: results };
    }
  }
];

// ==========================================
// LÓGICA E RENDERIZAÇÃO
// ==========================================
function navigate(id) { window.location.hash = id ? '#' + id : ''; }

function render() {
  const view = document.getElementById('view');
  const hash = window.location.hash.replace('#', '');

  if (!hash) {
    let cards = MODULES.map(m => `
      <div class="liquid-glass interactive p-8 text-center" onclick="navigate('${m.id}')">
        <div class="w-20 h-20 mx-auto rounded-3xl bg-[var(--accent-glow)] flex items-center justify-center mb-6 border border-[var(--accent)] border-opacity-30">
          <span class="material-symbols-rounded text-5xl text-[var(--accent)]">${m.icon}</span>
        </div>
        <h3 class="text-2xl font-bold mb-2">${m.name}</h3>
        <p class="text-sm text-[var(--text-muted)] font-medium">${m.desc}</p>
      </div>
    `).join('');

    view.innerHTML = `
      <div class="text-center mb-12 mt-4">
        <h1 class="text-4xl md:text-5xl font-bold mb-4 tracking-tight">O que deseja <span class="text-transparent bg-clip-text bg-gradient-to-r from-[var(--accent)] to-[#BF5AF2]">consultar?</span></h1>
        <p class="text-[var(--text-muted)] text-lg">Selecione um dos módulos abaixo para iniciar.</p>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">${cards}</div>
    `;
  } else {
    const m = MODULES.find(x => x.id === hash);
    if (!m) return navigate('');
    
    view.innerHTML = `
      <button onclick="navigate('')" class="liquid-glass interactive inline-flex items-center gap-2 px-5 py-3 rounded-full text-sm font-medium mb-8 hover:bg-white/10 transition">
        <span class="material-symbols-rounded text-lg">arrow_back</span> Voltar ao Painel
      </button>
      
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        <!-- Formulário (Coluna Esquerda) -->
        <div class="lg:col-span-4 liquid-glass p-8">
          <div class="text-center mb-8">
            <div class="w-20 h-20 rounded-3xl bg-[var(--accent-glow)] flex items-center justify-center mx-auto mb-4 border border-[var(--accent)] border-opacity-30">
              <span class="material-symbols-rounded text-4xl text-[var(--accent)]">${m.icon}</span>
            </div>
            <h2 class="text-2xl font-bold mb-1">${m.name}</h2>
            <p class="text-sm text-[var(--text-muted)]">${m.desc}</p>
          </div>
          
          <form id="searchForm" onsubmit="handleSearch(event, '${m.id}')">
            <div class="input-group">
              <input type="text" id="searchInput" class="input-glass" placeholder=" " maxlength="${m.max}" required autocomplete="off">
              <label class="input-label">Alvo da Consulta</label>
            </div>
            <button type="submit" class="btn-primary w-full">Consultar Agora</button>
          </form>
        </div>
        
        <!-- Resultados (Coluna Direita) -->
        <div class="lg:col-span-8">
          <div id="result" class="min-h-[400px] liquid-glass p-8 flex flex-col justify-center items-center text-center">
            <span class="material-symbols-rounded text-6xl text-white/10 mb-6">travel_explore</span>
            <h3 class="text-xl font-semibold text-[var(--text-muted)] mb-2">Aguardando Parâmetros</h3>
            <p class="text-sm text-[var(--text-muted)] opacity-70">Insira os dados ao lado para iniciar a consulta.</p>
          </div>
        </div>
      </div>
    `;

    if (m.digits) {
      document.getElementById('searchInput').addEventListener('input', function(e) {
        this.value = this.value.replace(/\D/g, '');
      });
    }
  }
}

async function handleSearch(e, id) {
  e.preventDefault();
  const m = MODULES.find(x => x.id === id);
  const val = document.getElementById('searchInput').value.trim();
  const btn = e.target.querySelector('button');
  const resDiv = document.getElementById('result');

  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-rounded spinner">refresh</span> Processando...';
  
  resDiv.innerHTML = `
    <span class="material-symbols-rounded spinner text-5xl mb-6 text-[var(--accent)]">refresh</span>
    <p class="font-medium text-lg text-[var(--accent)]">Consultando bases...</p>
  `;

  try {
    const data = await m.fetchApi(val);
    let htmlResult = '';
    
    if (id === 'sherlock') {
      if (data.profiles && Array.isArray(data.profiles)) {
        htmlResult = data.profiles.map(p => `
          <div class="data-item mb-3">
            <span class="material-symbols-rounded data-icon">account_circle</span>
            <div class="flex flex-col">
              <span class="data-label">${p.platform}</span>
              <a href="${p.url}" target="_blank" class="data-value text-[var(--accent)] underline">${p.url}</a>
              <span class="text-sm text-[var(--text-muted)] mt-1">${p.name || ''} ${p.repos ? `(${p.repos} repos)` : ''}</span>
            </div>
          </div>
        `).join('');
      } else {
        htmlResult = `<p class="text-[var(--text-muted)] text-center">${data.message || 'Nenhum dado encontrado.'}</p>`;
      }
    } else {
      if (Array.isArray(data)) {
         htmlResult = data.map((item, idx) => `
           <div class="mb-6"><h4 class="text-sm font-bold mb-3 text-[var(--accent)] uppercase tracking-wider">Resultado ${idx + 1}</h4>${renderDataGrid(item)}</div>
         `).join('');
      } else {
         htmlResult = renderDataGrid(data);
      }
    }

    resDiv.innerHTML = `
      <div class="w-full text-left">
        <div class="flex items-center gap-3 mb-6 pb-6 border-b border-[var(--glass-border)]">
          <span class="material-symbols-rounded text-[var(--success)] text-3xl">check_circle</span>
          <h3 class="font-bold text-xl">Informações Recuperadas</h3>
        </div>
        ${htmlResult}
      </div>
    `;

  } catch (err) {
    resDiv.innerHTML = `
      <div class="text-center">
        <span class="material-symbols-rounded text-6xl mb-4 text-[var(--danger)]">error</span>
        <h3 class="font-bold text-xl mb-2">Falha na Operação</h3>
        <p class="text-sm text-[var(--text-muted)]">${err.message}</p>
      </div>
    `;
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Consultar Agora';
  }
}

function renderDataGrid(data) {
  if (!data || typeof data !== 'object') return '';
  const ignoreKeys = ['raw', 'json', 'html', 'response', 'message'];
  const keys = Object.keys(data).filter(k => 
    !ignoreKeys.includes(k.toLowerCase()) && 
    (typeof data[k] !== 'object' || data[k] === null) && 
    data[k] !== ''
  );

  if (keys.length === 0) return '<p class="text-sm text-[var(--text-muted)]">Nenhum campo de texto para exibir.</p>';

  return `
    <div class="data-grid">
      ${keys.map(k => {
        let v = data[k];
        if (v === true) v = 'Sim';
        if (v === false) v = 'Não';
        return `
          <div class="data-item">
            <span class="material-symbols-rounded data-icon">${getIcon(k)}</span>
            <div class="flex flex-col">
              <span class="data-label">${k.replace(/_/g,' ')}</span>
              <span class="data-value">${v}</span>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}
