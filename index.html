<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API REST Brasil - Dashboard</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark min-h-screen">
    <script>
        // Aplica o tema antes da renderização para evitar flash
        if (localStorage.getItem('theme') === 'light') {
            document.body.className = 'theme-light min-h-screen';
        }
    </script>

    <div id="progressBar"></div>

    <div class="flex">
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-[60] w-64 border-r -translate-x-full lg:translate-x-0" style="background:var(--surface);border-color:var(--border)">
            <div class="flex flex-col h-full">
                <div class="flex items-center justify-between p-3 border-b lg:hidden" style="border-color:var(--border)">
                    <span class="text-1 font-bold text-sm">API REST BRASIL</span>
                    <button id="sidebar-close" class="icon-btn" aria-label="Fechar menu">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <div class="flex-1 p-3 overflow-y-auto">
                    <nav id="sidebar-nav" class="space-y-1"></nav>
                </div>
                <div class="p-3 border-t" style="border-color:var(--border)">
                    <div class="rounded-2xl p-3" style="background:linear-gradient(135deg,rgba(34,197,94,.1),rgba(59,130,246,.08))">
                        <div class="flex items-center justify-center gap-1.5 mb-2">
                            <span id="netStatus" class="s-dot check"></span>
                            <span id="netText" class="text-xs text-3">Verificando...</span>
                        </div>
                        <div class="text-center">
                            <div class="font-bold text-sm text-1" id="apiCount">0</div>
                            <div class="text-xs text-3">APIs disponíveis</div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Overlay Mobile -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-[55] lg:hidden"></div>

        <!-- Conteúdo Principal -->
        <div class="flex-1 lg:ml-64 min-w-0">
            <header id="header" class="border-b sticky top-0 z-50" style="background:var(--surface);border-color:var(--border)">
                <div class="px-4 py-3 flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <button id="sidebar-toggle" class="icon-btn lg:hidden" aria-label="Abrir menu">
                            <span class="material-symbols-outlined">menu</span>
                        </button>
                        <span class="font-bold text-base text-1">API REST <span style="color:#22c55e">BRASIL</span></span>
                    </div>
                    <div class="flex gap-1">
                        <button id="theme-toggle" class="icon-btn" aria-label="Alternar tema">
                            <span class="material-symbols-outlined" id="themeIcon">light_mode</span>
                        </button>
                    </div>
                </div>
            </header>
            
            <main id="view" class="p-4 lg:p-6"></main>
        </div>
    </div>

    <!-- Modal de Resultados -->
    <div id="analiticModal" role="dialog" aria-modal="true">
        <div class="mc">
            <div class="flex items-center justify-between p-4 border-b" style="border-color:var(--border)">
                <h2 class="font-semibold text-1">Resultado Completo</h2>
                <button id="btnCloseModal" class="icon-btn">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div id="modalBody" class="p-4 overflow-auto" style="max-height:calc(92vh - 4rem)"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
