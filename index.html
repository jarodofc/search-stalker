<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Glass OSINT</title>
<!-- Ícone: Impressão Digital Branca -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3E%3Cpath d='M17.81 4.47c-.08 0-.16-.02-.23-.06C15.66 3.42 14 3 12.01 3c-1.98 0-3.86.47-5.57 1.41-.24.13-.54.04-.68-.2-.13-.24-.04-.55.2-.68C7.82 2.52 9.86 2 12.01 2c2.13 0 3.99.47 6.03 1.52.25.13.34.43.21.67-.09.18-.26.28-.44.28zM3.5 9.72c-.1 0-.2-.03-.29-.09-.23-.16-.28-.47-.12-.7.99-1.4 2.25-2.5 3.75-3.27C9.98 4.04 14 4.03 17.15 5.65c1.5.77 2.76 1.86 3.75 3.25.16.22.11.54-.12.7-.23.16-.54.11-.7-.12-.9-1.26-2.04-2.25-3.39-2.94-2.87-1.47-6.54-1.47-9.4.01-1.36.7-2.5 1.7-3.4 2.96-.08.14-.23.21-.39.21zm6.25 12.07c-.13 0-.26-.05-.35-.15-.87-.87-1.34-1.43-2.01-2.64-.69-1.23-1.05-2.73-1.05-4.34 0-2.97 2.54-5.39 5.66-5.39s5.66 2.42 5.66 5.39c0 .28-.22.5-.5.5s-.5-.22-.5-.5c0-2.42-2.09-4.39-4.66-4.39-2.57 0-4.66 1.97-4.66 4.39 0 1.44.32 2.77.93 3.85.64 1.15 1.08 1.64 1.85 2.42.19.2.19.51 0 .71-.11.1-.24.15-.37.15zm7.17-1.85c-1.19 0-2.24-.3-3.1-.89-1.49-1.01-2.38-2.65-2.38-4.39 0-.28.22-.5.5-.5s.5.22.5.5c0 1.41.72 2.74 1.94 3.56.71.48 1.54.71 2.54.71.24 0 .64-.03 1.04-.1.27-.05.53.13.58.41.05.27-.13.53-.41.58-.57.11-1.07.12-1.21.12zM14.91 22c-.04 0-.09-.01-.13-.02-1.59-.44-2.63-1.03-3.72-2.1-1.4-1.39-2.17-3.24-2.17-5.22 0-1.62 1.38-2.94 3.08-2.94 1.7 0 3.08 1.32 3.08 2.94 0 1.07.93 1.94 2.08 1.94s2.08-.87 2.08-1.94c0-3.77-3.25-6.83-7.25-6.83-2.84 0-5.44 1.58-6.61 4.03-.39.81-.59 1.76-.59 2.8 0 .78.07 2.01.67 3.61.1.26-.03.55-.29.64-.26.1-.55-.04-.64-.29-.49-1.31-.73-2.61-.73-3.96 0-1.2.23-2.29.68-3.24 1.33-2.79 4.28-4.6 7.51-4.6 4.55 0 8.25 3.51 8.25 7.83 0 1.62-1.38 2.94-3.08 2.94s-3.08-1.32-3.08-2.94c0-1.07-.93-1.94-2.08-1.94s-2.08.87-2.08 1.94c0 1.71.66 3.31 1.87 4.51.95.94 1.86 1.46 3.27 1.85.27.07.42.35.35.61-.05.23-.26.38-.47.38z'/%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
  :root {
    --glass-bg: rgba(255, 255, 255, 0.01);
    --glass-border: rgba(255, 255, 255, 0.15);
    --text-main: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.6);
    --accent: #0A84FF;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #000;
    color: var(--text-main);
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    background: radial-gradient(circle at 20% 30%, #1a0b2e, #000),
                radial-gradient(circle at 80% 70%, #0b2e1a, #000);
    background-blend-mode: overlay;
  }

  /* Liquid Glass */
  .liquid-glass {
    background: var(--glass-bg);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 0 0 1px rgba(255, 255, 255, 0.1), inset 0 20px 40px rgba(255, 255, 255, 0.05);
    position: relative;
    overflow: hidden;
  }
  .liquid-glass::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(135deg, rgba(255,255,255,0.4), transparent 40%, transparent 60%, rgba(255,255,255,0.1));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .input-glass {
    width: 100%; padding: 14px 16px; background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px;
    color: #fff; outline: none; transition: .3s;
  }
  .input-glass:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.3); }

  .btn-primary {
    background: var(--accent); color: #fff; font-weight: 600; padding: 14px 24px;
    border-radius: 16px; border: none; cursor: pointer; display: flex;
    align-items: center; justify-content: center; gap: 8px; transition: .2s; width: 100%;
  }
  .btn-primary:hover { opacity: .9; transform: scale(0.98); }

  .data-item {
    display: flex; align-items: flex-start; gap: 12px; padding: 12px;
    background: rgba(255, 255, 255, 0.03); border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05);
  }
  .data-icon { color: var(--accent); font-size: 20px; margin-top: 2px; }
  .data-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 600; }
  .data-value { font-size: 14px; font-weight: 500; word-break: break-word; }

  .spinner { animation: spin 1s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-7xl mx-auto">
  <header class="liquid-glass p-4 flex items-center justify-between mb-8 rounded-2xl">
    <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('')">
      <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center border border-white/20">
        <span class="material-symbols-rounded text-2xl">fingerprint</span>
      </div>
      <span class="font-bold text-xl tracking-tight">Glass<span class="text-blue-400">OSINT</span></span>
    </div>
  </header>

  <main id="view" class="w-full"></main>
</div>

<script>
// ==========================================
// CONFIGURAÇÃO E FALLBACKS
// ==========================================
const CONFIG = {
  cpfKey: '778433e124468b1aa60f2681919cd918f852afe1761056985813881cb72a550f',
  corsProxy: 'https://api.allorigins.win/raw?url='
};

const ICON_MAP = {
  'cnpj': 'badge', 'cpf': 'fingerprint', 'placa': 'directions_car',
  'nome': 'person', 'email': 'mail', 'telefone': 'call', 'celular': 'smartphone',
  'uf': 'map', 'pais': 'public', 'municipio': 'location_city', 'cep': 'markunread_mailbox',
  'logradouro': 'signpost', 'numero': 'numbers', 'bairro': 'holiday_village',
  'data': 'calendar_today', 'nascimento': 'cake', 'abertura': 'event',
  'situacao': 'info', 'status': 'check_circle', 'cnae': 'category', 'natureza': 'gavel',
  'marca': 'local_offer', 'modelo': 'commute', 'ano': 'update', 'cor': 'palette', 'chassi': 'tag',
  'combustivel': 'local_gas_station', 'motor': 'settings', 'brand': 'local_offer', 'model': 'commute',
  'color': 'palette', 'fuel': 'local_gas_station', 'year': 'update', 'city': 'location_city', 'state': 'map',
  'username': 'alternate_email', 'profile': 'account_circle', 'url': 'link', 'repos': 'folder'
};

function getIcon(key) {
  const k = key.toLowerCase();
  for (const [search, icon] of Object.entries(ICON_MAP)) {
    if (k.includes(search)) return icon;
  }
  return 'info';
}

// Função auxiliar para tentar múltiplas fontes
async function tryFallback(sources) {
  for (const source of sources) {
    try {
      const result = await source();
      if (result) return result;
    } catch (e) {
      console.warn('Fonte falhou, tentando próxima...', e);
    }
  }
  throw new Error('Todas as fontes de dados falharam ou não retornaram resultados.');
}

const MODULES = [
  { 
    id: 'cnpj', name: 'CNPJ', desc: 'Consulta de Empresas', icon: 'domain', placeholder: 'Apenas números (14 dígitos)', max: 14, digits: true,
    fetchApi: async (v) => {
      const clean = v.replace(/\D/g,'');
      return await tryFallback([
        // Fonte 1: MinhaReceita
        async () => {
          const r = await fetch(`https://minhareceita.org/${clean}`);
          if(!r.ok) throw new Error();
          return await r.json();
        },
        // Fonte 2: BrasilAPI
        async () => {
          const r = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${clean}`);
          if(!r.ok) throw new Error();
          return await r.json();
        },
        // Fonte 3: ReceitaWS
        async () => {
          const r = await fetch(`https://receitaws.com.br/v1/cnpj/${clean}`);
          if(!r.ok) throw new Error();
          return await r.json();
        }
      ]);
    }
  },
  { 
    id: 'cpf', name: 'CPF', desc: 'Consulta de Pessoas', icon: 'fingerprint', placeholder: 'Apenas números (11 dígitos)', max: 11, digits: true,
    fetchApi: async (v) => {
      const clean = v.replace(/\D/g,'');
      return await tryFallback([
        // Fonte 1: CPFHub (com chave)
        async () => {
          const r = await fetch(`https://api.cpfhub.io/cpf/${clean}`, { 
            headers: { 'x-api-key': CONFIG.cpfKey, 'Accept': 'application/json' } 
          });
          if(!r.ok) throw new Error();
          const raw = await r.json();
          return raw.data || raw.result || raw;
        },
        // Fonte 2: Fallback (validação local se API falhar)
        async () => {
          // Simulação de fallback: retorna um objeto indicando que a validação local foi usada
          return { 
            aviso: 'API externa indisponível. Exibindo validação básica.',
            cpf: clean,
            formato_valido: clean.length === 11
          };
        }
      ]);
    }
  },
  { 
    id: 'placa', name: 'Placa', desc: 'Consulta de Veículos (FIPE)', icon: 'directions_car', placeholder: 'ABC1D23', max: 7, digits: false,
    fetchApi: async (v) => {
      const placa = v.replace(/[^A-Za-z0-9]/g,'').toUpperCase();
      return await tryFallback([
        // Fonte 1: Parallelum FIPE
        async () => {
          const r = await fetch(`https://fipe.parallelum.com.br/api/v2/plates/${placa}`);
          if(!r.ok) throw new Error();
          return await r.json();
        },
        // Fonte 2: Fallback genérico (exemplo: outra API pública se existir)
        async () => {
          // Como não há outra API pública gratuita de placa sem chave, retornamos erro controlado
          throw new Error('API FIPE indisponível. Tente novamente mais tarde.');
        }
      ]);
    }
  },
  {
    id: 'sherlock', name: 'Sherlock (OSINT)', desc: 'Busca de Username', icon: 'search', placeholder: 'Ex: johndoe', max: 30, digits: false,
    fetchApi: async (v) => {
      const username = v.trim();
      const results = [];
      
      // GitHub
      try {
        const gh = await fetch(`${CONFIG.corsProxy}${encodeURIComponent(`https://api.github.com/users/${username}`)}`);
        if (gh.ok) {
          const d = await gh.json();
          if (d.login) results.push({ platform: 'GitHub', found: true, url: d.html_url, name: d.name, repos: d.public_repos });
        }
      } catch(e) {}

      // Reddit
      try {
        const rd = await fetch(`${CONFIG.corsProxy}${encodeURIComponent(`https://www.reddit.com/user/${username}/about.json`)}`);
        if (rd.ok) {
          const d = await rd.json();
          if (d.data && !d.data.error) results.push({ platform: 'Reddit', found: true, url: `https://reddit.com/user/${username}`, name: d.data.name, karma: d.data.link_karma });
        }
      } catch(e) {}

      if (results.length === 0) {
        return { message: `Nenhum perfil encontrado para "${username}".`, checked: ['GitHub', 'Reddit'] };
      }
      return { username: username, profiles: results };
    }
  }
];

// ==========================================
// LÓGICA E RENDERIZAÇÃO
// ==========================================
function navigate(id) { window.location.hash = id ? '#' + id : ''; }

function render() {
  const view = document.getElementById('view');
  const hash = window.location.hash.replace('#', '');

  if (!hash) {
    let cards = MODULES.map(m => `
      <div class="liquid-glass p-6 cursor-pointer hover:scale-[1.02] transition-transform" onclick="navigate('${m.id}')">
        <div class="w-12 h-12 rounded-xl bg-blue-500/20 flex items-center justify-center mb-4 text-blue-400">
          <span class="material-symbols-rounded text-3xl">${m.icon}</span>
        </div>
        <h3 class="text-xl font-bold mb-1">${m.name}</h3>
        <p class="text-sm text-white/60">${m.desc}</p>
      </div>
    `).join('');

    view.innerHTML = `
      <div class="text-center mb-10">
        <h1 class="text-4xl font-bold mb-4">OSINT <span class="text-blue-400">Dashboard</span></h1>
        <p class="text-white/60">Selecione uma ferramenta.</p>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">${cards}</div>
    `;
  } else {
    const m = MODULES.find(x => x.id === hash);
    if (!m) return navigate('');
    
    view.innerHTML = `
      <button onclick="navigate('')" class="liquid-glass inline-flex items-center gap-2 px-4 py-2 rounded-full text-sm mb-6 hover:bg-white/10 transition">
        <span class="material-symbols-rounded text-sm">arrow_back</span> Voltar
      </button>
      
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        <div class="lg:col-span-4 liquid-glass p-6">
          <div class="text-center mb-6">
            <div class="w-16 h-16 rounded-2xl bg-blue-500/20 flex items-center justify-center mx-auto mb-4 text-blue-400">
              <span class="material-symbols-rounded text-3xl">${m.icon}</span>
            </div>
            <h2 class="text-xl font-bold">${m.name}</h2>
            <p class="text-xs text-white/60">${m.desc}</p>
          </div>
          <form id="searchForm" onsubmit="handleSearch(event, '${m.id}')">
            <label class="block text-xs font-semibold mb-2 text-white/60 uppercase tracking-wider">Alvo da Consulta</label>
            <input type="text" id="searchInput" class="input-glass mb-4" placeholder="${m.placeholder}" maxlength="${m.max}" required autocomplete="off">
            <button type="submit" class="btn-primary">Consultar Agora</button>
          </form>
        </div>
        
        <div class="lg:col-span-8">
          <div id="result" class="min-h-[300px] liquid-glass p-6 flex flex-col justify-center items-center text-center">
            <span class="material-symbols-rounded text-5xl text-white/20 mb-4">travel_explore</span>
            <p class="text-white/40">Aguardando parâmetros...</p>
          </div>
        </div>
      </div>
    `;

    if (m.digits) {
      document.getElementById('searchInput').addEventListener('input', function(e) {
        this.value = this.value.replace(/\D/g, '');
      });
    }
  }
}

async function handleSearch(e, id) {
  e.preventDefault();
  const m = MODULES.find(x => x.id === id);
  const val = document.getElementById('searchInput').value.trim();
  const btn = e.target.querySelector('button');
  const resDiv = document.getElementById('result');

  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-rounded spinner">refresh</span> Processando...';
  
  resDiv.innerHTML = `
    <span class="material-symbols-rounded spinner text-4xl mb-4 text-blue-400">refresh</span>
    <p class="font-medium">Consultando bases...</p>
  `;

  try {
    const data = await m.fetchApi(val);

    let htmlResult = '';
    
    if (id === 'sherlock') {
      if (data.profiles && Array.isArray(data.profiles)) {
        htmlResult = data.profiles.map(p => `
          <div class="data-item mb-2">
            <span class="material-symbols-rounded data-icon">account_circle</span>
            <div class="data-content">
              <span class="data-label">${p.platform}</span>
              <span class="data-value"><a href="${p.url}" target="_blank" class="text-blue-400 underline">${p.url}</a></span>
              <span class="text-xs text-white/50">${p.name || ''} ${p.repos ? `(${p.repos} repos)` : ''}</span>
            </div>
          </div>
        `).join('');
      } else {
        htmlResult = `<p class="text-white/60">${data.message || 'Nenhum dado encontrado.'}</p>`;
      }
    } else {
      if (Array.isArray(data)) {
         htmlResult = data.map((item, idx) => `
           <div class="mb-4"><h4 class="text-sm font-bold mb-2 text-blue-400">Resultado ${idx + 1}</h4>${renderDataGrid(item)}</div>
         `).join('');
      } else {
         htmlResult = renderDataGrid(data);
      }
    }

    resDiv.innerHTML = `
      <div class="w-full">
        <div class="flex items-center gap-2 mb-4 pb-4 border-b border-white/10">
          <span class="material-symbols-rounded text-green-400 text-2xl">check_circle</span>
          <h3 class="font-bold text-lg">Informações Recuperadas</h3>
        </div>
        ${htmlResult}
      </div>
    `;

  } catch (err) {
    resDiv.innerHTML = `
      <div class="text-center">
        <span class="material-symbols-rounded text-5xl mb-4 text-red-400">error</span>
        <h3 class="font-bold text-lg mb-2">Falha na Operação</h3>
        <p class="text-sm text-white/60">${err.message}</p>
      </div>
    `;
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Consultar Agora';
  }
}

function renderDataGrid(data) {
  if (!data || typeof data !== 'object') return '';
  const ignoreKeys = ['raw', 'json', 'html', 'response', 'message'];
  const keys = Object.keys(data).filter(k => 
    !ignoreKeys.includes(k.toLowerCase()) && 
    (typeof data[k] !== 'object' || data[k] === null) && 
    data[k] !== ''
  );

  if (keys.length === 0) return '<p class="text-sm text-white/50">Nenhum campo de texto para exibir.</p>';

  return `
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      ${keys.map(k => {
        let v = data[k];
        if (v === true) v = 'Sim';
        if (v === false) v = 'Não';
        return `
          <div class="data-item">
            <span class="material-symbols-rounded data-icon">${getIcon(k)}</span>
            <div class="data-content">
              <span class="data-label">${k.replace(/_/g,' ')}</span>
              <span class="data-value">${v}</span>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

window.addEventListener('hashchange', render);
document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
