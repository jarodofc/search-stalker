<style>
  :root {
    --ios-bg: #000000;
    --ios-surface: rgba(28, 28, 30, 0.62);
    --ios-surface-elevated: rgba(44, 44, 46, 0.68);
    --ios-border: rgba(255, 255, 255, 0.14);
    --ios-border-highlight: rgba(255, 255, 255, 0.28);
    --ios-label: #FFFFFF;
    --ios-secondary: rgba(235, 235, 245, 0.65);
    --ios-tertiary: rgba(235, 235, 245, 0.35);
    --ios-blue: #0A84FF;
    --ios-green: #30D158;
    --ios-red: #FF453A;
    --ios-orange: #FF9F0A;
    --ios-purple: #BF5AF2;
    --ios-indigo: #5E5CE6;
    --ios-teal: #64D2FF;
    --ios-pink: #FF375F;
    --spring: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  input, textarea { user-select: text; -webkit-user-select: text; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background-color: var(--ios-bg);
    color: var(--ios-label);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Wallpaper iOS Liquid Mesh */
  .ios-wallpaper {
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(circle at 15% 12%, rgba(10, 132, 255, 0.32), transparent 42%),
      radial-gradient(circle at 85% 18%, rgba(191, 90, 242, 0.26), transparent 44%),
      radial-gradient(circle at 75% 85%, rgba(48, 209, 88, 0.18), transparent 45%),
      radial-gradient(circle at 20% 80%, rgba(94, 92, 230, 0.25), transparent 45%),
      #000000;
  }

  /* Liquid Glass Container (iOS 26 Style) */
  .liquid-glass {
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0.03) 100%);
    backdrop-filter: blur(36px) saturate(210%);
    -webkit-backdrop-filter: blur(36px) saturate(210%);
    border: 1px solid var(--ios-border);
    box-shadow:
      0 18px 40px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 0 var(--ios-border-highlight),
      inset 0 -1px 0 0 rgba(255, 255, 255, 0.04);
    border-radius: 28px;
    transition: transform 0.28s var(--spring), background 0.25s ease, border-color 0.25s ease;
  }

  /* Dynamic Island Pill */
  .dynamic-island {
    background: rgba(12, 12, 14, 0.86);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.16);
    border-radius: 999px;
    padding: 8px 16px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: transform 0.25s var(--spring);
  }
  .dynamic-island:active { transform: scale(0.96); }

  /* Squircle iOS App Icon */
  .ios-app-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    padding: 6px;
    transition: transform 0.24s var(--spring);

  .ios-app-tile:hover { transform: translateY(-3px); }
  .ios-app-tile:active { transform: scale(0.91); }

  .squircle-icon {
    width: 66px;

  /* View Transition */
  .view-enter { animation: iosZoomIn 0.28s var(--spring) forwards; }
  @keyframes iosZoomIn {
    from { opacity: 0; transform: scale(0.96) translateY(8px); }

  .spinner { animation: spin 0.9s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

    flex-direction: column;

</style>

<script>
(() => {
  'use strict';

  // ==========================================================
  // 1. PROTEÇÃO DE CÓDIGO (SEM FALSOS POSITIVOS NO MOBILE/PC)
  // ==========================================================
  const AUTHOR_SIGNATURE = 'KIIK HACKING';
  const lockOverlay = document.getElementById('securityLock');
  let lockTimer = null;

  const triggerLock = () => {
    lockOverlay.classList.add('active');
    clearTimeout(lockTimer);
    lockTimer = setTimeout(() => {
      lockOverlay.classList.remove('active');
    }, 2200);
  };

  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('dragstart', (e) => e.preventDefault());
  document.addEventListener('keydown', (e) => {
    const key = (e.key || '').toUpperCase();
    const isBlocked =
      key === 'F12' ||
      (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'K'].includes(key)) ||
      (e.metaKey && e.altKey && ['I', 'J', 'C'].includes(key)) ||
      (e.ctrlKey && ['U', 'S'].includes(key));
    if (isBlocked) {
      e.preventDefault();
      e.stopPropagation();
      triggerLock();
      return false;
    }
  }, true);

  // ==========================================================
  // 2. CAMADA SILENCIOSA DE CRIPTOGRAFIA P2P (KIIK HACKING)
  // ==========================================================
  const P2PSecurityLayer = (() => {
    const enc = new TextEncoder();
    const dec = new TextDecoder();
    let sessionKeys = null;

    const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
    const fromB64 = (str) => Uint8Array.from(atob(str), c => c.charCodeAt(0));

    async function ensureSession() {
      if (sessionKeys) return sessionKeys;
      if (!window.crypto?.subtle) return null;

      const peerA = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey']);
      const peerB = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey']);

      const sharedAesKey = await crypto.subtle.deriveKey(
        { name: 'ECDH', public: peerB.publicKey },
        peerA.privateKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );

      const hmacKey = await crypto.subtle.importKey(
        'raw',
        enc.encode(`${AUTHOR_SIGNATURE}::P2P::SESSION::E2EE`),
        { name: 'HMAC', hash: 'SHA-256' },
        false,
        ['sign', 'verify']
      );

      sessionKeys = { sharedAesKey, hmacKey };
      return sessionKeys;
    }

    async function sealStorage(plainStr) {
      try {
        const ctx = await ensureSession();
        if (!ctx) return plainStr;
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, ctx.sharedAesKey, enc.encode(plainStr));
        return JSON.stringify({ iv: toB64(iv), ct: toB64(ct), s: AUTHOR_SIGNATURE });
      } catch {
        return plainStr;
      }
    }

    async function signExport(payload) {
      const ts = new Date().toISOString();
      const raw = JSON.stringify(payload);
      let sig = 'P2P-FALLBACK-HASH';
      try {
        const ctx = await ensureSession();
        if (ctx) {
          const mac = await crypto.subtle.sign('HMAC', ctx.hmacKey, enc.encode(`${ts}|${raw}|${AUTHOR_SIGNATURE}`));
          sig = toB64(mac);
        }
      } catch {}
      return {
        signed_by: AUTHOR_SIGNATURE,
        transport: 'P2P-ECDH-P256-AES256GCM',
        timestamp: ts,
        hmac_sha256: sig,
        data: payload
      };
    }

    return { sealStorage, signExport };
  })();

  // ==========================================================

  const _vault = ['Nzc4NDMzZTEyNDQ2OGIxYWE2MGYyNjgxOTE5Y2Q5MThmODUyYWZlMTc2MTA1Njk4NTgxMzg4MWNiNzJhNTUwZg=='];
  const getApiKey = () => atob(_vault[0]);

  const PORTAIS_VEICULARES = [
    {
      nome: 'Situação do Veículo (DETRAN-MG)',

      icone: 'fact_check',
      cor: 'linear-gradient(135deg, #0A84FF, #0055D4)',

    {

  let lastResultData = null;

  const ICON_MAP = {

  function getIcon(key) {
    const k = String(key || '').toLowerCase();
    for (const [term, icon] of Object.entries(ICON_MAP)) {

    }
    return 'data_object';

  async function fetchJson(url, options = {}, timeoutMs = 10000) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const r = await fetch(url, { ...options, signal: ctrl.signal });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return await r.json();
    } finally {
      clearTimeout(timer);
    }
  }

  async function tryFallback(sources) {
    let lastErr;
    for (const fn of sources) {
      try {
        const res = await fn();
        if (res) return res;
      } catch (e) {
        lastErr = e;
      }
    }
    throw new Error(lastErr?.message || 'Nenhuma fonte respondeu no momento.');
  }

  async function saveHistory(moduleId, query) {
    historyCache = historyCache.filter(i => !(i.moduleId === moduleId && i.query === query));
    historyCache.unshift({ moduleId, query, ts: Date.now() });
    historyCache = historyCache.slice(0, 15);
    try {
      localStorage.setItem('kiik_ios_history_v1', JSON.stringify(historyCache));
      const sealed = await P2PSecurityLayer.sealStorage(JSON.stringify(historyCache));
      localStorage.setItem('kiik_ios_p2p_vault', sealed);
    } catch {}
  }

  function getHistory(moduleId) {
    return historyCache.filter(i => i.moduleId === moduleId).slice(0, 5);
  }

  async function checkViaProxy(url, notFoundPatterns = []) {
    try {
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
      const res = await fetchJson(proxyUrl, {}, 8000);
      const code = res?.status?.http_code;
      const html = (res?.contents || '').toLowerCase();

      if (code === 404 || code === 410) return { status: 'notfound', label: 'Não encontrado' };
      if (code === 403 || code === 429 || !code || html.includes('cf-browser-verification') || html.includes('just a moment')) {
        return { status: 'manual', label: 'Verificar' };
      }
      if (notFoundPatterns.some(p => html.includes(p.toLowerCase()))) {
        return { status: 'notfound', label: 'Não encontrado' };
      }
      if (code >= 200 && code < 400) return { status: 'found', label: 'Encontrado' };
      return { status: 'manual', label: 'Verificar' };
    } catch {
      return { status: 'manual', label: 'Verificar' };
    }
  }

  function buildOsintTargets(alvo) {

        const title = doc.querySelector('title')?.textContent?.trim() || '-';

          doc.querySelector('meta[name="description"]')?.getAttribute('content')?.trim() ||

        return await tryFallback([
          async () => {
            const raw = await fetchJson(`https://api.cpfhub.io/cpf/${cpf}`, {
              headers: { 'x-api-key': getApiKey(), 'Accept': 'application/json' }
            });
            const info = raw.data || raw.result || raw;
            if (!info || typeof info !== 'object') throw new Error('Resposta inválida');
            const resumo = {};
            for (const [k, val] of Object.entries(info)) {
              if (val !== null && val !== '' && typeof val !== 'object') {
                resumo[k] = val === true ? 'Sim' : val === false ? 'Não' : val;
              }
            }
            return { resumo, raw };
          },
          async () => {
            const isRepeated = /^(\d)\1{10}$/.test(cpf);
            const calcDigit = (slice) => {
              let sum = 0;
              for (let i = 0; i < slice.length; i++) sum += Number(slice[i]) * (slice.length + 1 - i);
              const mod = (sum * 10) % 11;
              return mod === 10 ? 0 : mod;
            };
            const isValid = !isRepeated && calcDigit(cpf.slice(0, 9)) === Number(cpf[9]) && calcDigit(cpf.slice(0, 10)) === Number(cpf[10]);

              '6': 'MG', '7': 'ES, RJ', '8': 'SP', '9': 'PR, SC'
            };

              resumo: {
                cpf: cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4'),
                status_api: 'Fallback local',

  async function handleAtpvPrepare(e) {
    e.preventDefault();
    const placa = document.getElementById('atpvPlaca').value.trim().toUpperCase();
    const renavam = document.getElementById('atpvRenavam').value.replace(/\D/g, '');
    const doc = document.getElementById('atpvDoc').value.replace(/\D/g, '');
    const chassi = document.getElementById('atpvChassi').value.trim().toUpperCase();

    lastResultData = { placa, renavam: renavam || '-', cpf_cnpj: doc || '-', chassi_crv: chassi || '-' };
    lastModuleId = `veiculo-${placa}`;
    await saveHistory('atpv', placa);

    const campos = [
      { label: 'Placa', val: placa },
      ...(renavam ? [{ label: 'RENAVAM', val: renavam }] : []),
      ...(doc ? [{ label: 'CPF / CNPJ', val: doc }] : []),
      ...(chassi ? [{ label: 'Chassi / CRV', val: chassi }] : [])
    ];

    let titularHtml = '';
    if (doc.length === 14) {
      try {
        const res = await MODULES.find(m => m.id === 'cnpj').fetchApi(doc);
        titularHtml = `
          <div class="mb-4 p-4 rounded-2xl bg-[#30D158]/10 border border-[#30D158]/30">
            <span class="text-[11px] uppercase tracking-wider text-[#30D158] font-bold block mb-1">Titular Identificado (CNPJ)</span>
            <p class="text-sm font-bold text-white">${escapeHtml(res.resumo.razao_social || '-')}</p>
            <p class="text-xs text-[var(--ios-secondary)] mt-0.5">${escapeHtml(res.resumo.situacao)} • ${escapeHtml(res.resumo.municipio_uf)}</p>
          </div>
        `;
      } catch {}
    } else if (doc.length === 11) {
      try {
        const res = await MODULES.find(m => m.id === 'cpf').fetchApi(doc);
        const nome = res.resumo.nome || res.resumo.name || res.resumo.regiao_fiscal || 'CPF validado';
        titularHtml = `
          <div class="mb-4 p-4 rounded-2xl bg-[#30D158]/10 border border-[#30D158]/30">
            <span class="text-[11px] uppercase tracking-wider text-[#30D158] font-bold block mb-1">Titular Identificado (CPF)</span>
            <p class="text-sm font-bold text-white">${escapeHtml(nome)}</p>
          </div>
        `;
      } catch {}
    }

    const portaisHtml = PORTAIS_VEICULARES.map(p => `
      <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="ios-row">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0" style="background:${p.cor}">
            <span class="material-symbols-rounded text-white text-lg">${p.icone}</span>
          </div>
          <div class="flex flex-col min-w-0">
            <span class="font-semibold text-sm text-white truncate">${p.nome}</span>
            <span class="text-xs text-[var(--ios-secondary)] truncate">${p.desc}</span>
          </div>
        </div>
        <span class="material-symbols-rounded text-lg text-[var(--ios-tertiary)]">chevron_right</span>
      </a>
    `).join('');

    document.getElementById('atpvResult').innerHTML = `
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4 pb-3 border-b border-white/10">
        <div class="flex items-center gap-2">
          <span class="material-symbols-rounded text-[#30D158] text-2xl">check_circle</span>
          <h3 class="font-bold text-lg">Veículo ${escapeHtml(placa)}</h3>
        </div>
        <button type="button" class="ios-pill-btn text-xs" data-export="download">
          <span class="material-symbols-rounded text-sm text-[#0A84FF]">verified</span> Exportar Assinado
        </button>
      </div>
      ${titularHtml}
      <div class="ios-group mb-5">
        ${campos.map(c => `
          <div class="ios-row">
            <div class="flex flex-col min-w-0">
              <span class="text-[11px] uppercase tracking-wider text-[var(--ios-secondary)] font-semibold">${escapeHtml(c.label)}</span>
              <span class="text-sm font-semibold text-white truncate">${escapeHtml(c.val)}</span>
            </div>
            <button type="button" class="ios-pill-btn text-xs py-1.5 px-3" data-copy-val="${escapeHtml(c.val)}">
              <span class="material-symbols-rounded text-sm">content_copy</span> Copiar

      <h4 class="text-xs uppercase tracking-wider text-[var(--ios-secondary)] font-semibold mb-2.5 px-1">Abrir Portal Oficial</h4>

          <div class="squircle-icon" style="background: ${m.gradient};">
            <span class="material-symbols-rounded">${escapeHtml(m.icon)}</span>
          </div>
          <span class="text-xs font-medium text-white text-center leading-tight tracking-tight max-w-[84px] truncate">
            ${escapeHtml(m.name)}
          </span>
        </div>
      `).join('');

      view.innerHTML = `
        <div class="view-enter">
          <div class="liquid-glass p-6 sm:p-8 mb-6">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-7">
              <div>
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">Central de Inteligência</h1>
                <p class="text-xs sm:text-sm text-[var(--ios-secondary)] mt-0.5">Toque em um aplicativo para iniciar a consulta</p>
              </div>
              <span class="text-[11px] font-semibold text-[#30D158] bg-[#30D158]/15 px-3 py-1.5 rounded-full self-start sm:self-auto">
                ● Online • P2P E2EE
              </span>

            <div class="grid grid-cols-3 sm:grid-cols-5 gap-y-6 gap-x-3 justify-items-center">
              ${apps}
            </div>
          </div>
        </div>

    if (m.customView === 'atpv') {

    }

    const history = getHistory(m.id);
    const historyHtml = history.length ? `
      <div class="mt-4 pt-4 border-t border-white/10">
        <span class="text-[11px] uppercase tracking-wider text-[var(--ios-secondary)] font-semibold block mb-2">Recentes</span>
        <div class="flex flex-wrap gap-2">
          ${history.map(h => `
            <button type="button" class="ios-pill-btn text-xs py-1 px-3" data-fill="${escapeHtml(h.query)}">
              ${escapeHtml(h.query)}
            </button>
          `).join('')}
        </div>
      </div>
    ` : '';

    view.innerHTML = `
      <div class="view-enter">
        <button type="button" data-nav="" class="ios-pill-btn mb-5">
          <span class="material-symbols-rounded text-base">arrow_back_ios_new</span> Início
        </button>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
          <div class="lg:col-span-4 liquid-glass p-6">
            <div class="flex flex-col items-center text-center mb-5">

                <span class="material-symbols-rounded" style="font-size:30px;">${escapeHtml(m.icon)}</span>
              </div>
              <h2 class="text-xl font-bold">${escapeHtml(m.name)}</h2>
              <p class="text-xs text-[var(--ios-secondary)] mt-0.5">${escapeHtml(m.desc)}</p>
            </div>

            <form id="searchForm">
              <div class="ios-field">
                <input type="text" id="searchInput" class="ios-input" placeholder=" " maxlength="${m.max}" ${m.optional ? '' : 'required'} autocomplete="off">
                <label for="searchInput" class="ios-label">${escapeHtml(m.placeholder)}</label>
              </div>
              <button type="submit" class="ios-btn-primary">
                <span class="material-symbols-rounded text-lg">search</span> Consultar
              </button>
            </form>
            ${historyHtml}
          </div>

          <div class="lg:col-span-8">
            <div id="result" class="min-h-[300px] liquid-glass p-6 flex flex-col justify-center items-center text-center">
              <span class="material-symbols-rounded text-5xl text-white/15 mb-2">travel_explore</span>
              <p class="text-sm text-[var(--ios-secondary)]">Preencha o campo ao lado para iniciar.</p>
            </div>

    const inputEl = document.getElementById('searchInput');
    if (m.digits) {
      inputEl.addEventListener('input', () => { inputEl.value = inputEl.value.replace(/\D/g, ''); });

  async function runProgressiveOsint(alvo, resDiv, btn) {
    await saveHistory('username', alvo);
    lastModuleId = 'osint';
    const categorias = buildOsintTargets(alvo);
    const report = { alvo, resultados: [] };
    let foundCount = 0;
    let notFoundCount = 0;

    resDiv.className = 'min-h-[300px] liquid-glass p-6 text-left';
    resDiv.innerHTML = `
      <div class="flex flex-wrap items-center justify-between gap-3 mb-5 pb-4 border-b border-white/10">
        <div>
          <h3 class="font-bold text-lg">Alvo: <span class="text-[#0A84FF]">${escapeHtml(alvo)}</span></h3>
          <p id="osintCounter" class="text-xs text-[var(--ios-secondary)] mt-0.5">Verificando plataformas...</p>
        </div>
        <div class="flex gap-2">
          <button type="button" class="ios-pill-btn text-xs" data-export="copy"><span class="material-symbols-rounded text-sm">content_copy</span> Copiar</button>
          <button type="button" class="ios-pill-btn text-xs" data-export="download"><span class="material-symbols-rounded text-sm text-[#0A84FF]">verified</span> Assinado</button>
        </div>
      </div>
      ${categorias.map(cat => `
        <div class="mb-5">
          <div class="flex items-center justify-between gap-2 mb-2 px-1">
            <h4 class="text-xs uppercase tracking-wider text-[var(--ios-secondary)] font-semibold flex items-center gap-1.5">
              <span class="material-symbols-rounded text-base text-[#0A84FF]">${escapeHtml(cat.icone)}</span>
              ${escapeHtml(cat.titulo)}
            </h4>
            <a href="${escapeHtml(cat.dorkGeral)}" target="_blank" rel="noopener noreferrer" class="ios-pill-btn text-[11px] py-1 px-2.5">
              <span class="material-symbols-rounded text-xs">manage_search</span> Dork Geral
            </a>
          </div>
          <div class="ios-group">
            ${cat.itens.map(item => `
              <a id="card-${escapeHtml(item.id)}" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" class="ios-row">
                <div class="flex flex-col min-w-0">
                  <span class="font-semibold text-sm text-white truncate">${escapeHtml(item.nome)}</span>
                  <span id="info-${escapeHtml(item.id)}" class="text-[11px] text-[var(--ios-secondary)] truncate">Checando...</span>
                </div>
                <span id="status-${escapeHtml(item.id)}" class="status-pill status-loading">
                  <span class="material-symbols-rounded text-xs spinner">refresh</span> Checando
                </span>
              </a>
            `).join('')}
          </div>
        </div>
      `).join('')}
    `;

    const allTasks = [];
    for (const cat of categorias) {
      for (const item of cat.itens) {
        allTasks.push(
          item.check().then(res => {
            const pill = document.getElementById(`status-${item.id}`);
            const infoEl = document.getElementById(`info-${item.id}`);
            if (!pill) return;

            if (res.status === 'found') {
              foundCount++;
              pill.className = 'status-pill status-found';
              pill.innerHTML = '<span class="material-symbols-rounded text-xs">check_circle</span> Encontrado';
              infoEl.textContent = res.info || 'Perfil localizado';
            } else if (res.status === 'notfound') {
              notFoundCount++;
              pill.className = 'status-pill status-notfound';
              pill.innerHTML = '<span class="material-symbols-rounded text-xs">cancel</span> Não encontrado';
              infoEl.textContent = 'Sem conta pública';
            } else {
              pill.className = 'status-pill status-manual';
              pill.innerHTML = `<span class="material-symbols-rounded text-xs">open_in_new</span> ${escapeHtml(res.label || 'Verificar')}`;
              infoEl.textContent = 'Toque para abrir';
            }

            report.resultados.push({ categoria: cat.titulo, site: item.nome, url: item.url, status: res.status });
            lastResultData = report;

            const counter = document.getElementById('osintCounter');
            if (counter) counter.textContent = `${foundCount} encontrado(s) • ${notFoundCount} não encontrado(s)`;
          })
        );
      }
    }

    await Promise.allSettled(allTasks);
    btn.disabled = false;
    btn.innerHTML = '<span class="material-symbols-rounded text-lg">search</span> Consultar';
  }

  async function handleSearch(e, id) {
    e.preventDefault();
    const m = MODULES.find(x => x.id === id);
    const val = document.getElementById('searchInput').value.trim();
    const btn = e.target.querySelector('button[type="submit"]');
    const resDiv = document.getElementById('result');

    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-rounded spinner text-lg">refresh</span> Consultando...';

    if (m.progressive) {
      await runProgressiveOsint(val, resDiv, btn);
      return;
    }

    resDiv.className = 'min-h-[300px] liquid-glass p-6 flex flex-col justify-center items-center text-center';
    resDiv.innerHTML = `
      <span class="material-symbols-rounded spinner text-4xl mb-2 text-[#0A84FF]">refresh</span>
      <p class="text-sm font-medium text-[var(--ios-secondary)]">Consultando bases...</p>
    `;

    try {
      const data = await m.fetchApi(val);
      lastResultData = data.raw || data;
      lastModuleId = id;
      if (val) await saveHistory(id, val);

      let sectionsHtml = '';
      if (data.resumo) sectionsHtml += renderIosList(data.resumo);
      if (data.listas && data.listas.length) {
        sectionsHtml += data.listas.map(lista => `
          <div class="mt-5">
            <h4 class="text-xs uppercase tracking-wider text-[var(--ios-secondary)] font-semibold mb-2 px-1">${escapeHtml(lista.titulo)} (${lista.itens.length})</h4>
            <div class="flex flex-wrap gap-2 max-h-60 overflow-y-auto">
              ${lista.itens.map(item => `<span class="text-xs px-3 py-1.5 rounded-full bg-white/10 text-white">${escapeHtml(item)}</span>`).join('')}
            </div>
          </div>
        `).join('');
      }

      resDiv.className = 'min-h-[300px] liquid-glass p-6 text-left';
      resDiv.innerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4 pb-3 border-b border-white/10">
          <div class="flex items-center gap-2">
            <span class="material-symbols-rounded text-[#30D158] text-2xl">check_circle</span>
            <h3 class="font-bold text-lg">Resultado</h3>
          </div>
          <div class="flex gap-2">
            <button type="button" class="ios-pill-btn text-xs" data-export="copy"><span class="material-symbols-rounded text-sm">content_copy</span> Copiar</button>
            <button type="button" class="ios-pill-btn text-xs" data-export="download"><span class="material-symbols-rounded text-sm text-[#0A84FF]">verified</span> Assinado</button>
          </div>
        </div>
        ${sectionsHtml}
      `;
    } catch (err) {
      resDiv.className = 'min-h-[300px] liquid-glass p-6 flex flex-col justify-center items-center text-center';
      resDiv.innerHTML = `
        <span class="material-symbols-rounded text-5xl mb-2 text-[#FF453A]">error</span>
        <h3 class="font-bold text-base mb-1">Falha na consulta</h3>
        <p class="text-xs text-[var(--ios-secondary)] max-w-md">${escapeHtml(err.message)}</p>
      `;
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-rounded text-lg">search</span> Consultar';
    }
  }

  function renderIosList(obj) {
    const entries = Object.entries(obj).filter(([, v]) => v !== undefined && v !== null && v !== '');
    if (!entries.length) return '<p class="text-sm text-[var(--ios-secondary)]">Nenhum dado retornado.</p>';
    return `
      <div class="ios-group">
        ${entries.map(([k, v]) => `
          <div class="ios-row">
            <div class="flex items-center gap-3 min-w-0">
              <span class="material-symbols-rounded text-[#0A84FF] text-xl shrink-0">${escapeHtml(getIcon(k))}</span>
              <div class="flex flex-col min-w-0">
                <span class="text-[11px] uppercase tracking-wider text-[var(--ios-secondary)] font-semibold">${escapeHtml(k.replace(/_/g, ' '))}</span>
                <span class="text-sm font-medium text-white break-words">${escapeHtml(v)}</span>
              </div>
            </div>
            <button type="button" class="ios-pill-btn text-[11px] py-1 px-2.5 shrink-0" data-copy-val="${escapeHtml(v)}">
              <span class="material-symbols-rounded text-xs">content_copy</span>
            </button>
          </div>
        `).join('')}
      </div>
    `;
  }

  // ==========================================================
  // 7. DELEGAÇÃO DE EVENTOS
  // ==========================================================
  document.addEventListener('click', async (e) => {
    const navEl = e.target.closest('[data-nav]');
    if (navEl) {
      navigate(navEl.getAttribute('data-nav'));
      return;
    }

    const fillEl = e.target.closest('[data-fill]');
    if (fillEl) {
      const input = document.getElementById('searchInput');
      if (input) {
        input.value = fillEl.getAttribute('data-fill');
        document.getElementById('searchForm')?.requestSubmit();
      }
      return;
    }

    const fillAtpv = e.target.closest('[data-fill-atpv]');
    if (fillAtpv) {
      const input = document.getElementById('atpvPlaca');
      if (input) input.value = fillAtpv.getAttribute('data-fill-atpv');
      return;
    }

    const copyVal = e.target.closest('[data-copy-val]');
    if (copyVal) {
      copyText(copyVal.getAttribute('data-copy-val'), copyVal);
      return;
    }

    const expEl = e.target.closest('[data-export]');
    if (expEl && lastResultData) {
      const signed = await P2PSecurityLayer.signExport(lastResultData);
      const jsonStr = JSON.stringify(signed, null, 2);
      if (expEl.getAttribute('data-export') === 'copy') {
        copyText(jsonStr, expEl);
      } else {
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `kiik-glassosint-${lastModuleId}-${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
      }
    }
  });

  window.addEventListener('hashchange', render);
  document.addEventListener('DOMContentLoaded', render);
})();
</script>
