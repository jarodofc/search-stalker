<style>
:root {

.ripple-host { position: relative; overflow: hidden; isolation: isolate; }

.md-field input::placeholder { color: transparent; }

.md-field label { position: absolute; left: .875rem; top: 50%; transform: translateY(-50%); font-size: .9375rem; color: var(--text-3); pointer-events: none; padding: 0 .25rem; transition: top var(--dur-s) var(--ease-std), font-size var(--dur-s) var(--ease-std), color var(--dur-s) var(--ease-std), background var(--dur-s) var(--ease-std); }
.md-field input:focus + label, .md-field input:not(:placeholder-shown) + label, .md-field select:focus + label, .md-field select:not([value=""]) + label { top: 0; font-size: .75rem; background: var(--surface-max); color: #22c55e; }

.hint { font-size: .75rem; color: var(--text-3); margin-top: .375rem; }
.nav-item { display: flex; align-items: center; gap: .5rem; padding: .5rem .625rem; border-radius: 8px; color: var(--text-3); text-decoration: none; font-size: .8125rem; transition: background var(--dur-s) var(--ease-std), color var(--dur-s) var(--ease-std); position: relative; }

.nav-bullet { width: 4px; height: 4px; border-radius: 50%; background: var(--text-3); flex-shrink: 0; transition: background var(--dur-s) var(--ease-std); }
.nav-item.active .nav-bullet { background: #22c55e; }
#sidebar { transition: transform var(--dur-l) var(--ease-emph); }

#analiticModal.open { opacity: 1; visibility: visible; }

.search-wrap { position: relative; }
.search-wrap .material-symbols-outlined { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
.search-input { width: 100%; padding: .875rem 1rem .875rem 3rem; background: var(--surface); border: 1px solid var(--border); border-radius: 9999px; color: var(--text-1); font-size: .9375rem; transition: border-color var(--dur-s) var(--ease-std); }
.search-input:focus { outline: none; border-color: #22c55e; }
.search-input::placeholder { color: var(--text-3); }
.empty-state { text-align: center; padding: 3rem 1.5rem; }
.empty-state .material-symbols-outlined { color: var(--text-3); opacity: .6; margin-bottom: 1rem; }
#progressBar { position: fixed; top: 0; left: 0; height: 3px; background: #22c55e; width: 0; z-index: 9999; transition: width var(--dur-m) var(--ease-std), opacity var(--dur-m) var(--ease-std); opacity: 0; box-shadow: 0 0 8px #22c55e; }
#progressBar.active { opacity: 1; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.status-dot.online { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
.status-dot.offline { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
.status-dot.checking { background: #f59e0b; animation: pulseStatus 1s infinite; }
@keyframes pulseStatus { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
.result-table { width: 100%; border-collapse: collapse; font-size: .8125rem; }
.result-table th, .result-table td { padding: .5rem .625rem; text-align: left; border-bottom: 1px solid var(--border); }
.result-table th { color: var(--text-3); font-weight: 500; font-size: .75rem; text-transform: uppercase; letter-spacing: .025em; }
.result-table tr:last-child td { border-bottom: none; }
.result-table tr:hover td { background: var(--state-hover); }
.kv-row { display: flex; justify-content: space-between; padding: .5rem 0; border-bottom: 1px solid var(--border); font-size: .875rem; gap: 1rem; }
.kv-row:last-child { border-bottom: none; }
.kv-key { color: var(--text-3); }
.kv-val { color: var(--text-1); font-weight: 500; text-align: right; word-break: break-word; }
.banner-warn { display: flex; align-items: flex-start; gap: .75rem; padding: .875rem 1rem; border-radius: 12px; background: rgba(251,146,60,.1); border: 1px solid rgba(251,146,60,.3); color: #fb923c; }
.banner-err { display: flex; align-items: flex-start; gap: .75rem; padding: .875rem 1rem; border-radius: 12px; background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: #f87171; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } .lift:hover { transform: none; } }
@media print { body > *:not(#analiticModal) { display: none !important; } #analiticModal { display: block !important; position: static; opacity: 1; visibility: visible; background: #fff; padding: 0; backdrop-filter: none; } #analiticModal .modal-content { max-width: 100%; max-height: none; box-shadow: none; transform: none !important; opacity: 1 !important; } #analiticModal .modal-header button { display: none !important; } #analiticModal .modal-body { max-height: none; overflow: visible; } #analiticModal, #analiticModal * { color: #000 !important; background: #fff !important; } }
</style>

const MODULES = [
  { id: 'cnpj_brasilapi', title: 'CNPJ (BrasilAPI)', desc: 'Empresa por CNPJ via BrasilAPI', icon: 'domain', category: 'Empresas', endpoints: ['https://brasilapi.com.br/api/cnpj/v1/{cnpj}'], inputs: [{ key: 'cnpj', label: 'CNPJ', placeholder: '00000000000000', maxlength: 14, digits: true, validate: v => v.length === 14 || 'CNPJ deve ter 14 dígitos' }] },
