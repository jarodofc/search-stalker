<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="zFORENSE v2.0 — Workstation Modular de Pericia Digital, OSINT e Threat Intelligence." />
  <title>zFORENSE v2.0 — Pericia Digital &amp; OSINT</title>
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <div class="app-shell">
    <aside class="sidebar" aria-label="Modulos">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            <circle cx="12" cy="11" r="3"></circle>
          </svg>
        </div>
        <div>
          <div class="brand-name">zFORENSE</div>
          <div class="brand-sub">v2.0 • Vercel Modular</div>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="menu-btn" id="menu-toggle" aria-label="Menu">☰</button>
          <button type="button" class="proxy-pill" id="proxy-status">Conectando Proxy Remoto...</button>
        </div>
        <button type="button" class="btn btn-sm btn-secondary" id="theme-toggle">Tema Claro / Escuro</button>
      </header>

      <main class="workspace">
        <div class="workspace-header">
          <h1 class="workspace-title" id="workspace-title">Carregando...</h1>
          <p class="workspace-desc" id="workspace-desc"></p>
        </div>
        <div id="workspace-body"></div>
      </main>
    </div>
  </div>

  <div class="toast-host" id="toast-host" aria-live="polite"></div>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
