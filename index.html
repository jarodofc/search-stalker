<script>
// ==========================================
// CONFIGURAÇÃO

const CONFIG = {
  cpfKey: '778433e124468b1aa60f2681919cd918f852afe1761056985813881cb72a550f'
};

// ==========================================
// UTILITÁRIOS
// ==========================================
let lastResultData = null;

function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

const ICON_MAP = {
  cnpj: 'badge', cpf: 'fingerprint', email: 'mail', nome: 'person', name: 'person',
  razao: 'domain', fantasia: 'storefront', uf: 'map', estado: 'map', pais: 'public',
  country: 'public', municipio: 'location_city', cidade: 'location_city', city: 'location_city',
  cep: 'markunread_mailbox', logradouro: 'signpost', bairro: 'holiday_village',
  data: 'calendar_today', nascimento: 'cake', birth: 'cake', genero: 'wc', gender: 'wc',
  abertura: 'event', situacao: 'info', status: 'check_circle', cnae: 'category',
  natureza: 'gavel', capital: 'payments', ip: 'router', isp: 'dns', org: 'hub',
  asn: 'lan', latitude: 'location_on', longitude: 'location_on', ddd: 'call',
  telefone: 'call', regiao: 'explore', platform: 'apps', url: 'link'
};

function getIcon(key) {
  const k = String(key || '').toLowerCase();
  for (const [term, icon] of Object.entries(ICON_MAP)) {
    if (k.includes(term)) return icon;
  }
  return 'data_object';
}

async function fetchJson(url, options = {}, timeoutMs = 10000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const r = await fetch(url, { ...options, signal: ctrl.signal });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } finally {
    clearTimeout(timer);
  }
}

async function tryFallback(sources) {
  let lastErr;
  for (const fn of sources) {
    try {
      const res = await fn();
      if (res) return res;
    } catch (e) {
      lastErr = e;
    }
  }
  throw new Error(lastErr?.message || 'Nenhuma fonte respondeu.');
}

function saveHistory(moduleId, query) {
  try {
    const key = 'glassosint_history';
    const list = JSON.parse(localStorage.getItem(key) || '[]');
    const filtered = list.filter(i => !(i.moduleId === moduleId && i.query === query));
    filtered.unshift({ moduleId, query, ts: Date.now() });
    localStorage.setItem(key, JSON.stringify(filtered.slice(0, 8)));
  } catch (e) {}
}

function getHistory(moduleId) {
  try {
    const list = JSON.parse(localStorage.getItem('glassosint_history') || '[]');
    return list.filter(i => i.moduleId === moduleId).slice(0, 5);
  } catch (e) {
    return [];
  }
}

// ==========================================
// MÓDULOS OSINT
// ==========================================
const MODULES = [
  {
    id: 'cpf',
    name: 'CPF',
    desc: 'CPFHub.io + Validação Local',
    icon: 'fingerprint',
    placeholder: 'Apenas números (11 dígitos)',
    max: 14,
    digits: true,
    fetchApi: async (v) => {
      const cpf = v.replace(/\D/g, '');
      if (cpf.length !== 11) throw new Error('Informe um CPF com 11 dígitos.');

      return await tryFallback([
        async () => {
          const raw = await fetchJson(`https://api.cpfhub.io/cpf/${cpf}`, {
            headers: {
              'x-api-key': CONFIG.cpfKey,
              'Accept': 'application/json'
            }
          });
          const info = raw.data || raw.result || raw;
          if (!info || typeof info !== 'object') throw new Error('Resposta inválida da CPFHub.io');

          const resumo = {};
          for (const [k, val] of Object.entries(info)) {
            if (val !== null && val !== '' && typeof val !== 'object') {
              resumo[k] = val === true ? 'Sim' : val === false ? 'Não' : val;
            }
          }
          return { resumo, raw };
        },
        async () => {
          const isRepeated = /^(\d)\1{10}$/.test(cpf);
          const calcDigit = (slice) => {
            let sum = 0;
            for (let i = 0; i < slice.length; i++) sum += Number(slice[i]) * (slice.length + 1 - i);
            const mod = (sum * 10) % 11;
            return mod === 10 ? 0 : mod;
          };
          const isValid = !isRepeated && calcDigit(cpf.slice(0, 9)) === Number(cpf[9]) && calcDigit(cpf.slice(0, 10)) === Number(cpf[10]);
          const regioes = {
            '0': 'RS', '1': 'DF, GO, MS, MT, TO', '2': 'AC, AM, AP, PA, RO, RR',
            '3': 'CE, MA, PI', '4': 'AL, PB, PE, RN', '5': 'BA, SE',
            '6': 'MG', '7': 'ES, RJ', '8': 'SP', '9': 'PR, SC'
          };
          return {
            resumo: {
              cpf: cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4'),
              status_api: 'CPFHub.io indisponível (fallback local)',
              valido: isValid ? 'Sim (Dígitos válidos)' : 'Não (Dígitos inválidos)',
              regiao_fiscal: isValid ? regioes[cpf[8]] : '-'
            },
            raw: { cpf, valid: isValid, regiao_fiscal: regioes[cpf[8]] }
          };
        }
      ]);
    }
  },
  {
    id: 'cnpj',
    name: 'CNPJ',
    desc: 'BrasilAPI / MinhaReceita / CNPJ.ws',
    icon: 'domain',
    placeholder: 'Ex: 00000000000191',
    max: 18,
    digits: true,
    fetchApi: async (v) => {
      const clean = v.replace(/\D/g, '');
      if (clean.length !== 14) throw new Error('Informe um CNPJ válido com 14 dígitos.');
      const data = await tryFallback([
        () => fetchJson(`https://brasilapi.com.br/api/cnpj/v1/${clean}`),
        () => fetchJson(`https://minhareceita.org/${clean}`),
        () => fetchJson(`https://publica.cnpj.ws/cnpj/${clean}`)
      ]);
      const socios = (data.qsa || data.socios || []).map(s => ({
        nome: s.nome_socio || s.nome || 'Não informado',
        qualificacao: s.qualificacao_socio || s.qualificacao?.descricao || '-'
      }));
      return {
        resumo: {
          cnpj: data.cnpj || clean,
          razao_social: data.razao_social,
          nome_fantasia: data.nome_fantasia || data.estabelecimento?.nome_fantasia || '-',
          situacao: data.descricao_situacao_cadastral || data.estabelecimento?.situacao_cadastral || '-',
          data_abertura: data.data_inicio_atividade || data.estabelecimento?.data_inicio_atividade || '-',
          cnae_principal: data.cnae_fiscal_descricao || data.estabelecimento?.atividade_principal?.descricao || '-',
          capital_social: data.capital_social != null ? `R$ ${Number(data.capital_social).toLocaleString('pt-BR')}` : '-',
          municipio_uf: `${data.municipio || data.estabelecimento?.cidade?.nome || '-'} / ${data.uf || data.estabelecimento?.estado?.sigla || '-'}`,
          logradouro: `${data.logradouro || data.estabelecimento?.logradouro || ''}, ${data.numero || data.estabelecimento?.numero || 'S/N'}`,
          cep: data.cep || data.estabelecimento?.cep || '-'
        },
        listas: socios.length ? [{ titulo: 'Quadro Societário (QSA)', itens: socios.map(s => `${s.nome} — ${s.qualificacao}`) }] : [],
        raw: data
      };
    }
  },
  {
    id: 'cep',
    name: 'CEP / Endereço',
    desc: 'BrasilAPI v2 / ViaCEP',
    icon: 'markunread_mailbox',
    placeholder: 'Ex: 30140071',
    max: 9,
    digits: true,
    fetchApi: async (v) => {
      const clean = v.replace(/\D/g, '');
      if (clean.length !== 8) throw new Error('Informe um CEP com 8 dígitos.');
      const data = await tryFallback([
        () => fetchJson(`https://brasilapi.com.br/api/cep/v2/${clean}`),
        async () => {
          const r = await fetchJson(`https://viacep.com.br/ws/${clean}/json/`);
          if (r.erro) throw new Error('CEP não encontrado.');
          return r;
        }
      ]);
      return {
        resumo: {
          cep: data.cep || clean,
          logradouro: data.street || data.logradouro || '-',
          bairro: data.neighborhood || data.bairro || '-',
          cidade: data.city || data.localidade || '-',
          uf: data.state || data.uf || '-',
          latitude: data.location?.coordinates?.latitude || '-',
          longitude: data.location?.coordinates?.longitude || '-'
        },
        raw: data
      };
    }
  },
  {
    id: 'ip',
    name: 'IP / Geolocalização',
    desc: 'ipwho.is / ipapi.co',
    icon: 'router',
    placeholder: 'Ex: 8.8.8.8 (ou vazio)',
    max: 45,
    digits: false,
    optional: true,
    fetchApi: async (v) => {
      const target = v.trim();
      const data = await tryFallback([
        async () => {
          const r = await fetchJson(`https://ipwho.is/${encodeURIComponent(target)}`);
          if (r.success === false) throw new Error(r.message || 'IP inválido');
          return r;
        },
        () => fetchJson(target ? `https://ipapi.co/${encodeURIComponent(target)}/json/` : 'https://ipapi.co/json/')
      ]);
      return {
        resumo: {
          ip: data.ip,
          tipo: data.type || data.version || '-',
          pais: `${data.country || data.country_name || '-'} (${data.country_code || '-'})`,
          regiao: data.region || '-',
          cidade: data.city || '-',
          isp: data.connection?.isp || data.org || '-',
          asn: data.connection?.asn || data.asn || '-',
          latitude: data.latitude,
          longitude: data.longitude,
          fuso_horario: data.timezone?.id || data.timezone || '-'
        },
        raw: data
      };
    }
  },
  {
    id: 'domain',
    name: 'Domínio (DNS + RDAP)',
    desc: 'Google DoH + Registro.br / RDAP',
    icon: 'language',
    placeholder: 'Ex: exemplo.com.br',
    max: 80,
    digits: false,
    fetchApi: async (v) => {
      const domain = v.trim().toLowerCase().replace(/^https?:\/\//, '').split('/')[0];
      if (!domain || !domain.includes('.')) throw new Error('Informe um domínio válido (ex: site.com.br).');

      const [dnsA, dnsMX, dnsNS, dnsTXT, rdap] = await Promise.all([
        fetchJson(`https://dns.google/resolve?name=${encodeURIComponent(domain)}&type=A`).catch(() => null),
        fetchJson(`https://dns.google/resolve?name=${encodeURIComponent(domain)}&type=MX`).catch(() => null),
        fetchJson(`https://dns.google/resolve?name=${encodeURIComponent(domain)}&type=NS`).catch(() => null),
        fetchJson(`https://dns.google/resolve?name=${encodeURIComponent(domain)}&type=TXT`).catch(() => null),
        fetchJson(
          domain.endsWith('.br')
            ? `https://rdap.registro.br/domain/${encodeURIComponent(domain)}`
            : `https://rdap.org/domain/${encodeURIComponent(domain)}`
        ).catch(() => null)
      ]);

      const extractDns = (res) => (res?.Answer || []).map(a => a.data);
      const events = (rdap?.events || []).reduce((acc, ev) => {
        acc[ev.eventAction] = ev.eventDate?.split('T')[0];
        return acc;
      }, {});

      return {
        resumo: {
          dominio: domain,
          status_rdap: (rdap?.status || []).join(', ') || 'Não retornado',
          registro: events.registration || '-',
          expiracao: events.expiration || '-',
          ultima_alteracao: events['last changed'] || '-'
        },
        listas: [
          { titulo: 'Registros A (IPv4)', itens: extractDns(dnsA) },
          { titulo: 'Servidores de E-mail (MX)', itens: extractDns(dnsMX) },
          { titulo: 'Nameservers (NS)', itens: extractDns(dnsNS) },
          { titulo: 'Registros TXT (SPF/DMARC/Verificações)', itens: extractDns(dnsTXT) }
        ].filter(l => l.itens.length > 0),
        raw: { dnsA, dnsMX, dnsNS, dnsTXT, rdap }
      };
    }
  },
  {
    id: 'username',
    name: 'Username (OSINT)',
    desc: 'GitHub, GitLab, Dev.to, HackerNews',
    icon: 'person_search',
    placeholder: 'Ex: torvalds',
    max: 40,
    digits: false,
    fetchApi: async (v) => {
      const user = v.trim();
      if (!user) throw new Error('Informe um nome de usuário.');
      const enc = encodeURIComponent(user);

      const checks = await Promise.all([
        fetchJson(`https://api.github.com/users/${enc}`).then(d => d.login ? ({
          platform: 'GitHub', url: d.html_url, info: `${d.name || d.login} • ${d.public_repos} repos • ${d.followers} seguidores`
        }) : null).catch(() => null),

        fetchJson(`https://gitlab.com/api/v4/users?username=${enc}`).then(arr => arr[0] ? ({
          platform: 'GitLab', url: arr[0].web_url, info: `${arr[0].name} • Estado: ${arr[0].state}`
        }) : null).catch(() => null),

        fetchJson(`https://dev.to/api/users/by_username?url=${enc}`).then(d => d.username ? ({
          platform: 'Dev.to', url: `https://dev.to/${d.username}`, info: `${d.name || d.username} • ${d.summary || 'Sem bio'}`
        }) : null).catch(() => null),

        fetchJson(`https://hacker-news.firebaseio.com/v0/user/${enc}.json`).then(d => d && d.id ? ({
          platform: 'Hacker News', url: `https://news.ycombinator.com/user?id=${d.id}`, info: `Karma: ${d.karma}`
        }) : null).catch(() => null)
      ]);

      const found = checks.filter(Boolean);
      return {
        resumo: {
          username: user,
          perfis_encontrados: found.length,
          plataformas_verificadas: 'GitHub, GitLab, Dev.to, Hacker News'
        },
        links: found,
        raw: found
      };
    }
  },
  {
    id: 'breach',
    name: 'Vazamentos (E-mail)',
    desc: 'XposedOrNot API',
    icon: 'security',
    placeholder: 'Ex: teste@exemplo.com',
    max: 80,
    digits: false,
    fetchApi: async (v) => {
      const email = v.trim();
      if (!email.includes('@')) throw new Error('Informe um e-mail válido.');
      const r = await fetch(`https://api.xposedornot.com/v1/check-email/${encodeURIComponent(email)}`);
      if (r.status === 404) {
        return {
          resumo: { email, status: 'Nenhum vazamento encontrado', base: 'XposedOrNot' },
          raw: { email, breaches: [] }
        };
      }
      if (!r.ok) throw new Error(`Erro na API XposedOrNot (HTTP ${r.status}).`);
      const data = await r.json();
      const breaches = Array.isArray(data.breaches?.[0]) ? data.breaches[0] : (data.breaches || []);
      return {
        resumo: {
          email,
          status: breaches.length ? 'Exposto em vazamentos' : 'Seguro',
          total_vazamentos: breaches.length
        },
        listas: breaches.length ? [{ titulo: 'Bases onde o e-mail apareceu', itens: breaches }] : [],
        raw: data
      };
    }
  },
  {
    id: 'ddd',
    name: 'DDD (Brasil)',
    desc: 'BrasilAPI — Estado e Cidades',
    icon: 'call',
    placeholder: 'Ex: 31',
    max: 2,
    digits: true,
    fetchApi: async (v) => {
      const ddd = v.replace(/\D/g, '');
      if (ddd.length !== 2) throw new Error('Informe um DDD com 2 dígitos.');
      const data = await fetchJson(`https://brasilapi.com.br/api/ddd/v1/${ddd}`);
      return {
        resumo: { ddd, estado: data.state, total_cidades: data.cities?.length || 0 },
        listas: [{ titulo: 'Municípios atendidos', itens: data.cities || [] }],
        raw: data
      };
    }
  }
];

// ==========================================
// NAVEGAÇÃO E RENDERIZAÇÃO
// ==========================================
function navigate(id) {
  window.location.hash = id ? '#' + id : '';
}

function render() {
  const view = document.getElementById('view');
  const hash = window.location.hash.replace('#', '');

  if (!hash) {
    const cards = MODULES.map(m => `
      <div class="liquid-glass interactive p-6 text-center" onclick="navigate('${escapeHtml(m.id)}')">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-[var(--accent-glow)] flex items-center justify-center mb-4 border border-[var(--accent)]/30">
          <span class="material-symbols-rounded text-3xl text-[var(--accent)]">${escapeHtml(m.icon)}</span>
        </div>
        <h3 class="text-lg font-bold mb-1">${escapeHtml(m.name)}</h3>
        <p class="text-xs text-[var(--text-muted)]">${escapeHtml(m.desc)}</p>
      </div>
    `).join('');

    view.innerHTML = `
      <div class="text-center mb-10 mt-2">
        <h1 class="text-3xl md:text-4xl font-bold mb-2">
          Pegada <span class="text-transparent bg-clip-text bg-gradient-to-r from-[var(--accent)] to-[#BF5AF2]">Digital</span>
        </h1>
        <p class="text-sm text-[var(--text-muted)]">Módulos OSINT integrados a APIs públicas e CPFHub.io.</p>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">${cards}</div>
    `;
    return;
  }

  const m = MODULES.find(x => x.id === hash);
  if (!m) return navigate('');

  const history = getHistory(m.id);
  const historyHtml = history.length ? `
    <div class="mt-5 pt-4 border-t border-[var(--glass-border)]">
      <span class="text-[11px] uppercase tracking-wider text-[var(--text-muted)] font-semibold block mb-2">Recentes</span>
      <div class="flex flex-wrap gap-2">
        ${history.map(h => `
          <button type="button" class="btn-ghost text-xs py-1 px-2.5" onclick="fillAndSearch('${escapeHtml(h.query)}')">
            ${escapeHtml(h.query)}
          </button>
        `).join('')}
      </div>
    </div>
  ` : '';

  view.innerHTML = `
    <button onclick="navigate('')" class="liquid-glass interactive inline-flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium mb-6">
      <span class="material-symbols-rounded text-lg">arrow_back</span> Voltar
    </button>
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      <div class="lg:col-span-4 liquid-glass p-6">
        <div class="text-center mb-6">
          <div class="w-14 h-14 rounded-2xl bg-[var(--accent-glow)] flex items-center justify-center mx-auto mb-3 border border-[var(--accent)]/30">
            <span class="material-symbols-rounded text-3xl text-[var(--accent)]">${escapeHtml(m.icon)}</span>
          </div>
          <h2 class="text-xl font-bold mb-1">${escapeHtml(m.name)}</h2>
          <p class="text-xs text-[var(--text-muted)]">${escapeHtml(m.desc)}</p>
        </div>
        <form id="searchForm" onsubmit="handleSearch(event, '${escapeHtml(m.id)}')">
          <div class="input-group">
            <input type="text" id="searchInput" class="input-glass" placeholder=" " maxlength="${m.max}" ${m.optional ? '' : 'required'} autocomplete="off">
            <label for="searchInput" class="input-label">${escapeHtml(m.placeholder)}</label>
          </div>
          <button type="submit" class="btn-primary w-full">
            <span class="material-symbols-rounded text-lg">search</span> Consultar
          </button>
        </form>
        ${historyHtml}
      </div>
      <div class="lg:col-span-8">
        <div id="result" class="min-h-[320px] liquid-glass p-6 flex flex-col justify-center items-center text-center">
          <span class="material-symbols-rounded text-5xl text-white/10 mb-3">travel_explore</span>
          <p class="text-sm text-[var(--text-muted)]">Informe o alvo ao lado para iniciar a consulta.</p>
        </div>
      </div>
    </div>
  `;

  if (m.digits) {
    document.getElementById('searchInput').addEventListener('input', function () {
      this.value = this.value.replace(/\D/g, '');
    });
  }
}

function fillAndSearch(val) {
  const input = document.getElementById('searchInput');
  if (!input) return;
  input.value = val;
  document.getElementById('searchForm').requestSubmit();
}

async function handleSearch(e, id) {
  e.preventDefault();
  const m = MODULES.find(x => x.id === id);
  const val = document.getElementById('searchInput').value.trim();
  const btn = e.target.querySelector('button[type="submit"]');
  const resDiv = document.getElementById('result');

  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-rounded spinner text-lg">refresh</span> Consultando...';
  resDiv.className = 'min-h-[320px] liquid-glass p-6 flex flex-col justify-center items-center text-center';
  resDiv.innerHTML = `
    <span class="material-symbols-rounded spinner text-4xl mb-3 text-[var(--accent)]">refresh</span>
    <p class="text-sm font-medium text-[var(--accent)]">Consultando bases...</p>
  `;

  try {
    const data = await m.fetchApi(val);
    lastResultData = data.raw || data;
    if (val) saveHistory(id, val);

    let sectionsHtml = '';

    if (data.resumo) {
      sectionsHtml += renderDataGrid(data.resumo);
    }

    if (data.links && data.links.length) {
      sectionsHtml += `
        <div class="mt-6">
          <h4 class="text-xs uppercase tracking-wider text-[var(--accent)] font-bold mb-3">Perfis Encontrados</h4>
          <div class="space-y-2">
            ${data.links.map(l => `
              <div class="data-item">
                <span class="material-symbols-rounded data-icon">account_circle</span>
                <div class="flex flex-col">
                  <span class="data-label">${escapeHtml(l.platform)}</span>
                  <a href="${escapeHtml(l.url)}" target="_blank" rel="noopener noreferrer" class="data-value text-[var(--accent)] underline">${escapeHtml(l.url)}</a>
                  <span class="text-xs text-[var(--text-muted)] mt-1">${escapeHtml(l.info)}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    if (data.listas && data.listas.length) {
      sectionsHtml += data.listas.map(lista => `
        <div class="mt-6">
          <h4 class="text-xs uppercase tracking-wider text-[var(--accent)] font-bold mb-3">${escapeHtml(lista.titulo)} (${lista.itens.length})</h4>
          <div class="flex flex-wrap gap-2 max-h-60 overflow-y-auto pr-1">
            ${lista.itens.map(item => `<span class="text-xs px-3 py-1.5 rounded-xl bg-white/5 border border-white/10 text-[var(--text-main)]">${escapeHtml(item)}</span>`).join('')}
          </div>
        </div>
      `).join('');
    }

    resDiv.className = 'min-h-[320px] liquid-glass p-6 text-left';
    resDiv.innerHTML = `
      <div class="flex flex-wrap items-center justify-between gap-3 mb-5 pb-4 border-b border-[var(--glass-border)]">
        <div class="flex items-center gap-2">
          <span class="material-symbols-rounded text-[var(--success)] text-2xl">check_circle</span>
          <h3 class="font-bold text-lg">Resultado da Consulta</h3>
        </div>
        <div class="flex gap-2">
          <button type="button" class="btn-ghost" onclick="copyJson()">
            <span class="material-symbols-rounded text-base">content_copy</span> Copiar JSON
          </button>
          <button type="button" class="btn-ghost" onclick="downloadJson('${escapeHtml(id)}')">
            <span class="material-symbols-rounded text-base">download</span> Exportar
          </button>
        </div>
      </div>
      ${sectionsHtml}
    `;
  } catch (err) {
    resDiv.className = 'min-h-[320px] liquid-glass p-6 flex flex-col justify-center items-center text-center';
    resDiv.innerHTML = `
      <span class="material-symbols-rounded text-5xl mb-3 text-[var(--danger)]">error</span>
      <h3 class="font-bold text-lg mb-1">Falha na consulta</h3>
      <p class="text-sm text-[var(--text-muted)] max-w-md">${escapeHtml(err.message)}</p>
    `;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span class="material-symbols-rounded text-lg">search</span> Consultar';
  }
}

function renderDataGrid(obj) {
  const entries = Object.entries(obj).filter(([, v]) => v !== undefined && v !== null && v !== '');
  if (!entries.length) return '<p class="text-sm text-[var(--text-muted)]">Nenhum dado retornado.</p>';
  return `
    <div class="data-grid">
      ${entries.map(([k, v]) => `
        <div class="data-item">
          <span class="material-symbols-rounded data-icon">${escapeHtml(getIcon(k))}</span>
          <div class="flex flex-col">
            <span class="data-label">${escapeHtml(k.replace(/_/g, ' '))}</span>
            <span class="data-value">${escapeHtml(v)}</span>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function copyJson() {
  if (!lastResultData) return;
  navigator.clipboard.writeText(JSON.stringify(lastResultData, null, 2));
}

function downloadJson(prefix) {
  if (!lastResultData) return;
  const blob = new Blob([JSON.stringify(lastResultData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `glassosint-${prefix}-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

window.addEventListener('hashchange', render);
document.addEventListener('DOMContentLoaded', render);
</script>

</html>
