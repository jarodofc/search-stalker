<style>
  :root {
    --ios-bg: #05050A;
    --glass-bg: rgba(255, 255, 255, 0.06);
    --glass-bg-hover: rgba(255, 255, 255, 0.10);
    --glass-border: rgba(255, 255, 255, 0.14);
    --glass-highlight: rgba(255, 255, 255, 0.28);
    --text-primary: #FFFFFF;
    --text-secondary: rgba(235, 235, 245, 0.68);
    --text-tertiary: rgba(235, 235, 245, 0.40);
    --ios-blue: #0A84FF;
    --ios-green: #30D158;
    --ios-red: #FF453A;
    --ios-orange: #FF9F0A;
    --spring: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  input, textarea, select { user-select: text; -webkit-user-select: text; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background-color: var(--ios-bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .ios-wallpaper {
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(circle at 12% 10%, rgba(10, 132, 255, 0.28), transparent 40%),
      radial-gradient(circle at 88% 15%, rgba(191, 90, 242, 0.22), transparent 42%),
      radial-gradient(circle at 80% 85%, rgba(48, 209, 88, 0.16), transparent 45%),
      radial-gradient(circle at 15% 85%, rgba(94, 92, 230, 0.22), transparent 44%),
      #05050A;
  }

  /* Material 3 + iOS Liquid Glass Surface */
  .liquid-card {
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.03) 100%);
    backdrop-filter: blur(32px) saturate(200%);
    -webkit-backdrop-filter: blur(32px) saturate(200%);
    border: 1px solid var(--glass-border);
    box-shadow:
      0 16px 36px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 0 var(--glass-highlight);
    border-radius: 26px;
    transition: transform 0.26s var(--spring), background 0.2s ease, border-color 0.2s ease;
  }

  .app-widget {
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .app-widget:hover {
    transform: translateY(-4px);
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.13) 0%, rgba(255, 255, 255, 0.05) 100%);
    border-color: rgba(255, 255, 255, 0.24);
  }
  .app-widget:active { transform: scale(0.97); }

  /* Dynamic Island */
  .dynamic-island {
    background: rgba(14, 14, 18, 0.85);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.16);
    border-radius: 999px;
    padding: 8px 16px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: transform 0.2s var(--spring);
  }
  .dynamic-island:active { transform: scale(0.96); }

  /* iOS Squircle Icon */
  .squircle {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow:
      0 8px 20px rgba(0, 0, 0, 0.4),
      inset 0 1.5px 1px rgba(255, 255, 255, 0.45),
      inset 0 -2px 4px rgba(0, 0, 0, 0.25);
  }
  .squircle .material-symbols-rounded {
    font-size: 27px;
    color: #FFFFFF;
  }

  /* Material Design 3 Filled Glass Inputs */
  .md-field {
    position: relative;
    margin-bottom: 14px;
  }
  .md-input {
    width: 100%;
    padding: 22px 16px 8px;
    background: rgba(118, 118, 128, 0.20);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 16px;
    color: #FFFFFF;
    font-size: 15px;
    outline: none;
    transition: all 0.2s ease;
  }
  .md-input:focus {
    background: rgba(118, 118, 128, 0.30);
    border-color: var(--ios-blue);
    box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.25);
  }
  .md-label {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-secondary);
    font-size: 14px;
    pointer-events: none;
    transition: all 0.2s ease;
  }
  .md-input:focus ~ .md-label,
  .md-input:not(:placeholder-shown) ~ .md-label {
    top: 11px;
    font-size: 11px;
    font-weight: 600;
    color: var(--ios-blue);
  }

  /* Buttons */
  .ios-btn {
    width: 100%;
    background: var(--ios-blue);
    color: #FFFFFF;
    font-weight: 600;
    font-size: 15px;
    padding: 14px 20px;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 8px 22px rgba(10, 132, 255, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    transition: transform 0.2s var(--spring), opacity 0.2s ease;
  }
  .ios-btn:active { transform: scale(0.97); }
  .ios-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .ios-chip {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: #FFFFFF;
    font-size: 12px;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    transition: transform 0.2s var(--spring), background 0.2s ease;
  }
  .ios-chip:hover { background: rgba(255, 255, 255, 0.16); }
  .ios-chip:active { transform: scale(0.95); }

  /* iOS Grouped List */
  .ios-group {
    background: rgba(20, 20, 26, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 20px;
    overflow: hidden;
  }
  .ios-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 16px;
    border-bottom: 0.5px solid rgba(255, 255, 255, 0.10);
    text-decoration: none;
    color: inherit;
    transition: background 0.15s ease;
  }
  .ios-row:last-child { border-bottom: none; }
  .ios-row:hover { background: rgba(255, 255, 255, 0.06); }

  .pill-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .tag-ok { background: rgba(48, 209, 88, 0.18); color: var(--ios-green); }
  .tag-err { background: rgba(255, 69, 58, 0.18); color: var(--ios-red); }
  .tag-warn { background: rgba(255, 159, 10, 0.18); color: var(--ios-orange); }
  .tag-info { background: rgba(10, 132, 255, 0.18); color: var(--ios-blue); }

  .view-enter { animation: iosEnter 0.26s var(--spring) forwards; }
  @keyframes iosEnter {
    from { opacity: 0; transform: scale(0.97) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .spinner { animation: spin 0.9s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  #securityLock {

    inset: 0;

    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;

  #securityLock.active { display: flex; }
</style>

<script>
(() => {
  'use strict';

  // ==========================================================
  // 1. PROTEÇÃO ANTI-INSPEÇÃO (ZERO FALSOS POSITIVOS)
  // ==========================================================
  const AUTHOR_SIGNATURE = 'KIIK HACKING';
  const lockOverlay = document.getElementById('securityLock');
  let lockTimer = null;

  const triggerLock = () => {
    lockOverlay.classList.add('active');
    clearTimeout(lockTimer);
    lockTimer = setTimeout(() => lockOverlay.classList.remove('active'), 2200);
  };

  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('dragstart', (e) => e.preventDefault());
  document.addEventListener('keydown', (e) => {
    const key = (e.key || '').toUpperCase();
    const blocked =
      key === 'F12' ||
      (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'K'].includes(key)) ||
      (e.metaKey && e.altKey && ['I', 'J', 'C'].includes(key)) ||
      (e.ctrlKey && ['U', 'S'].includes(key));
    if (blocked) {
      e.preventDefault();
      e.stopPropagation();
      triggerLock();
      return false;
    }
  }, true);

  // ==========================================================
  // 2. CAMADA SILENCIOSA P2P E2EE + ASSINATURA (KIIK HACKING)
  // ==========================================================
  const P2PLayer = (() => {
    const enc = new TextEncoder();
    let ctx = null;
    const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));

    async function init() {
      if (ctx) return ctx;
      if (!window.crypto?.subtle) return null;
      const a = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey']);
      const b = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey']);
      const aes = await crypto.subtle.deriveKey(
        { name: 'ECDH', public: b.publicKey }, a.privateKey,
        { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
      );
      const hmac = await crypto.subtle.importKey(
        'raw', enc.encode(`${AUTHOR_SIGNATURE}::P2P::V3`),
        { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
      );
      ctx = { aes, hmac };
      return ctx;
    }

    async function seal(str) {
      try {
        const c = await init();
        if (!c) return str;
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, c.aes, enc.encode(str));
        return JSON.stringify({ iv: toB64(iv), ct: toB64(ct), s: AUTHOR_SIGNATURE });
      } catch { return str; }
    }

    async function signJson(payload) {
      const ts = new Date().toISOString();
      let sig = 'P2P-FALLBACK';
      try {
        const c = await init();
        if (c) {
          const mac = await crypto.subtle.sign('HMAC', c.hmac, enc.encode(`${ts}|${JSON.stringify(payload)}|${AUTHOR_SIGNATURE}`));
          sig = toB64(mac);
        }
      } catch {}
      return {
        signed_by: AUTHOR_SIGNATURE,
        protocol: 'P2P-ECDH-P256-AES256GCM',
        timestamp: ts,
        hmac_sha256: sig,
        data: payload
      };
    }

    return { seal, signJson };
  })();

  // ==========================================================
  // 3. UTILITÁRIOS, FALLBACK MULTI-API & TABELA LOCAL DDD
  // ==========================================================
  const _vault = ['Nzc4NDMzZTEyNDQ2OGIxYWE2MGYyNjgxOTE5Y2Q5MThmODUyYWZlMTc2MTA1Njk4NTgxMzg4MWNiNzJhNTUwZg=='];
  const getCpfKey = () => atob(_vault[0]);

  const DDD_LOCAL = {
    '11':'SP (São Paulo e Região)','12':'SP (Vale do Paraíba)','13':'SP (Baixada Santista)','14':'SP (Bauru/Marília)','15':'SP (Sorocaba)','16':'SP (Ribeirão Preto)','17':'SP (S. J. do Rio Preto)','18':'SP (Presidente Prudente)','19':'SP (Campinas)',
    '21':'RJ (Rio de Janeiro)','22':'RJ (Campos/Região dos Lagos)','24':'RJ (Volta Redonda/Petrópolis)','27':'ES (Vitória)','28':'ES (Cachoeiro de Itapemirim)',
    '31':'MG (Belo Horizonte e RMBH)','32':'MG (Juiz de Fora)','33':'MG (Governador Valadares/Vale do Aço)','34':'MG (Uberlândia/Uberaba)','35':'MG (Poços de Caldas/Pouso Alegre)','37':'MG (Divinópolis)','38':'MG (Montes Claros)',
    '41':'PR (Curitiba)','42':'PR (Ponta Grossa)','43':'PR (Londrina)','44':'PR (Maringá)','45':'PR (Foz do Iguaçu/Cascavel)','46':'PR (Francisco Beltrão)','47':'SC (Joinville/Blumenau)','48':'SC (Florianópolis)','49':'SC (Chapecó)',
    '51':'RS (Porto Alegre)','53':'RS (Pelotas)','54':'RS (Caxias do Sul)','55':'RS (Santa Maria)',
    '61':'DF/GO (Brasília e Entorno)','62':'GO (Goiânia)','63':'TO (Palmas)','64':'GO (Rio Verde)','65':'MT (Cuiabá)','66':'MT (Rondonópolis)','67':'MS (Campo Grande)','68':'AC (Rio Branco)','69':'RO (Porto Velho)',
    '71':'BA (Salvador)','73':'BA (Ilhéus/Itabuna)','74':'BA (Juazeiro)','75':'BA (Feira de Santana)','77':'BA (Vitória da Conquista)','79':'SE (Aracaju)',
    '81':'PE (Recife)','82':'AL (Maceió)','83':'PB (João Pessoa)','84':'RN (Natal)','85':'CE (Fortaleza)','86':'PI (Teresina)','87':'PE (Petrolina)','88':'CE (Juazeiro do Norte)','89':'PI (Picos)',
    '91':'PA (Belém)','92':'AM (Manaus)','93':'PA (Santarém)','94':'PA (Marabá)','95':'RR (Boa Vista)','96':'AP (Macapá)','97':'AM (Interior)','98':'MA (São Luís)','99':'MA (Imperatriz)'
  };

  const PORTAIS_VEICULARES = [
    { nome: 'Situação do Veículo (DETRAN-MG)', desc: 'Restrições, débitos e cadastro MG', icone: 'fact_check', cor: 'linear-gradient(135deg,#0A84FF,#0055D4)', url: 'https://detran.mg.gov.br/veiculos/situacao-do-veiculo/consulta-de-situacao-do-veiculo' },
    { nome: 'ATPV-e (DETRAN-MG)', desc: 'Autorização de transferência digital', icone: 'description', cor: 'linear-gradient(135deg,#5E5CE6,#3634A3)', url: 'https://detran.mg.gov.br/veiculos/transferencias/emitir-a-autorizacao-para-transferencia-de-propriedade-do-veiculo-atpv-e' },
    { nome: 'Portal SENATRAN (SERPRO)', desc: 'Base nacional de veículos e infrações', icone: 'public', cor: 'linear-gradient(135deg,#30D158,#1E9E3E)', url: 'https://portalservicos.senatran.serpro.gov.br/#/veiculos/consultar' },

  ];

  let lastResultData = null;
  let lastModuleId = 'osint';
  let historyCache = [];
  try { historyCache = JSON.parse(localStorage.getItem('kiik_v3_history') || '[]'); } catch { historyCache = []; }

  function escapeHtml(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function copyText(text, btnEl) {
    navigator.clipboard?.writeText(text).catch(() => {});
    if (btnEl) {
      const old = btnEl.innerHTML;
      btnEl.innerHTML = '<span class="material-symbols-rounded text-sm text-[#30D158]">check</span> Copiado';
      setTimeout(() => { btnEl.innerHTML = old; }, 1300);
    }
  }

  const ICON_MAP = {
    cnpj:'badge', cpf:'fingerprint', email:'mail', emails:'mail', nome:'person', name:'person',
    razao:'domain', fantasia:'storefront', uf:'map', estado:'map', pais:'public',
    municipio:'location_city', cidade:'location_city', cep:'markunread_mailbox',
    logradouro:'signpost', bairro:'holiday_village', data:'calendar_today', abertura:'event',
    situacao:'info', status:'check_circle', cnae:'category', capital:'payments', ip:'router',
    isp:'dns', asn:'lan', latitude:'location_on', longitude:'location_on', ddd:'call',
    regiao:'explore', url:'link', links:'link', placa:'directions_car', renavam:'pin',
    titulo:'title', descricao:'description', idioma:'translate', tecnologia:'memory',
    imagens:'image', fonte:'cloud_done', padrao:'verified'
  };

  function getIcon(key) {
    const k = String(key || '').toLowerCase();
    for (const [term, icon] of Object.entries(ICON_MAP)) {
      if (k.includes(term)) return icon;
    }
    return 'data_object';
  }

  async function fetchJson(url, options = {}, timeoutMs = 9500) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const r = await fetch(url, { ...options, signal: ctrl.signal });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return await r.json();
    } finally { clearTimeout(timer); }
  }

  async function fetchText(url, timeoutMs = 10000) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const r = await fetch(url, { signal: ctrl.signal });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return await r.text();
    } finally { clearTimeout(timer); }
  }

  // Motor de Redundância: tenta cada API em ordem e informa qual respondeu
  async function tryFallback(providers) {
    let lastErr;
    for (const p of providers) {
      try {
        const data = await p.run();
        if (data) return { data, provider: p.name };
      } catch (e) {
        lastErr = e;
      }
    }
    throw new Error(lastErr?.message || 'Todas as APIs configuradas falharam no momento.');
  }

  // Proxy com Fallback (AllOrigins -> CodeTabs)
  async function fetchHtmlWithFallback(targetUrl) {
    return tryFallback([
      {
        name: 'AllOrigins Proxy',
        run: async () => {
          const res = await fetchJson(`https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`, {}, 10000);
          if (!res?.contents) throw new Error('Sem HTML');
          return { html: res.contents, code: res?.status?.http_code || 200 };
        }
      },
      {
        name: 'CodeTabs Proxy (Alternativa)',
        run: async () => {
          const html = await fetchText(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`, 10000);
          if (!html) throw new Error('Sem HTML');
          return { html, code: 200 };
        }
      }
    ]);
  }

  async function saveHistory(moduleId, query) {
    historyCache = historyCache.filter(i => !(i.moduleId === moduleId && i.query === query));
    historyCache.unshift({ moduleId, query, ts: Date.now() });
    historyCache = historyCache.slice(0, 15);
    try {
      localStorage.setItem('kiik_v3_history', JSON.stringify(historyCache));
      localStorage.setItem('kiik_v3_p2p_vault', await P2PLayer.seal(JSON.stringify(historyCache)));
    } catch {}
  }

  function getHistory(moduleId) {
    return historyCache.filter(i => i.moduleId === moduleId).slice(0, 5);
  }

  async function checkViaProxy(url, notFoundPatterns = []) {
    try {
      const { data } = await fetchHtmlWithFallback(url);
      const html = (data.html || '').toLowerCase();
      if (data.code === 404 || data.code === 410) return { status: 'notfound', label: 'Não encontrado' };
      if (html.includes('cf-browser-verification') || html.includes('just a moment')) return { status: 'manual', label: 'Verificar' };
      if (notFoundPatterns.some(p => html.includes(p.toLowerCase()))) return { status: 'notfound', label: 'Não encontrado' };

  async function handleAtpvPrepare(e) {
    e.preventDefault();
    const placa = document.getElementById('atpvPlaca').value.trim().toUpperCase();
    const renavam = document.getElementById('atpvRenavam').value.replace(/\D/g, '');
    const doc = document.getElementById('atpvDoc').value.replace(/\D/g, '');
    const fipeCode = document.getElementById('atpvFipe').value.trim();

    const padraoPlaca = /^[A-Z]{3}[0-9][A-Z][0-9]{2}$/.test(placa) ? 'Mercosul' : (/^[A-Z]{3}[0-9]{4}$/.test(placa) ? 'Cinza (Antigo)' : 'Formato não padrão');

    lastResultData = { placa, padrao: padraoPlaca, renavam: renavam || '-', cpf_cnpj: doc || '-', fipe: fipeCode || '-' };
    lastModuleId = `veiculo-${placa}`;
    await saveHistory('atpv', placa);

    const campos = [
      { label: 'Placa', val: `${placa} (${padraoPlaca})` },
      ...(renavam ? [{ label: 'RENAVAM', val: renavam }] : []),
      ...(doc ? [{ label: 'CPF / CNPJ', val: doc }] : [])
    ];

    let extrasHtml = '';

    // 1. Consulta Titular automática (Multi-API)
    if (doc.length === 14) {
      try {
        const res = await MODULES.find(m => m.id === 'cnpj').fetchApi(doc);
        extrasHtml += `
          <div class="mb-4 p-4 rounded-2xl bg-[#30D158]/10 border border-[#30D158]/30">
            <span class="text-[11px] uppercase tracking-wider text-[#30D158] font-bold block mb-1">Titular (CNPJ • ${escapeHtml(res.provider)})</span>
            <p class="text-sm font-bold text-white">${escapeHtml(res.resumo.razao_social || '-')}</p>
            <p class="text-xs text-[var(--text-secondary)] mt-0.5">${escapeHtml(res.resumo.situacao)} • ${escapeHtml(res.resumo.municipio_uf)}</p>
          </div>
        `;
      } catch {}
    } else if (doc.length === 11) {
      try {
        const res = await MODULES.find(m => m.id === 'cpf').fetchApi(doc);
        const nome = res.resumo.nome || res.resumo.name || res.resumo.regiao_fiscal || 'CPF validado';
        extrasHtml += `
          <div class="mb-4 p-4 rounded-2xl bg-[#30D158]/10 border border-[#30D158]/30">
            <span class="text-[11px] uppercase tracking-wider text-[#30D158] font-bold block mb-1">Titular (CPF • ${escapeHtml(res.provider)})</span>
            <p class="text-sm font-bold text-white">${escapeHtml(nome)}</p>
          </div>
        `;
      } catch {}
    }

    // 2. Consulta FIPE (BrasilAPI -> Fallback)
    if (fipeCode) {
      try {
        const { data: fipeList, provider } = await tryFallback([
          { name: 'BrasilAPI FIPE', run: () => fetchJson(`https://brasilapi.com.br/api/fipe/preco/v1/${encodeURIComponent(fipeCode)}`) }
        ]);
        const item = Array.isArray(fipeList) ? fipeList[0] : fipeList;
        if (item) {
          extrasHtml += `
            <div class="mb-4 p-4 rounded-2xl bg-[#0A84FF]/10 border border-[#0A84FF]/30">
              <span class="text-[11px] uppercase tracking-wider text-[#0A84FF] font-bold block mb-1">Tabela FIPE (${escapeHtml(provider)})</span>
              <p class="text-sm font-bold text-white">${escapeHtml(item.marca)} ${escapeHtml(item.modelo)} (${escapeHtml(item.anoModelo)})</p>
              <p class="text-xs text-[var(--text-secondary)] mt-0.5">Valor: <strong class="text-white">${escapeHtml(item.valor)}</strong> • Ref: ${escapeHtml(item.mesReferencia)}</p>
            </div>
          `;
        }
      } catch {}
    }

    const portaisHtml = PORTAIS_VEICULARES.map(p => `
      <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="ios-row">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0" style="background:${p.cor}">
            <span class="material-symbols-rounded text-white text-lg">${p.icone}</span>
          </div>
          <div class="flex flex-col min-w-0">
            <span class="font-semibold text-sm text-white truncate">${p.nome}</span>
            <span class="text-xs text-[var(--text-secondary)] truncate">${p.desc}</span>
          </div>
        </div>
        <span class="material-symbols-rounded text-lg text-[var(--text-tertiary)]">chevron_right</span>
      </a>
    `).join('');

    document.getElementById('atpvResult').innerHTML = `
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4 pb-3 border-b border-white/10">
        <div class="flex items-center gap-2">
          <span class="material-symbols-rounded text-[#30D158] text-2xl">check_circle</span>
          <h3 class="font-bold text-lg">Veículo ${escapeHtml(placa)}</h3>
        </div>
        <button type="button" class="ios-chip" data-export="download">
          <span class="material-symbols-rounded text-sm text-[#0A84FF]">verified</span> Exportar Assinado
        </button>
      </div>
      ${extrasHtml}
      <div class="ios-group mb-5">
        ${campos.map(c => `
          <div class="ios-row">
            <div class="flex flex-col min-w-0">
              <span class="text-[11px] uppercase tracking-wider text-[var(--text-secondary)] font-semibold">${escapeHtml(c.label)}</span>
              <span class="text-sm font-semibold text-white truncate">${escapeHtml(c.val)}</span>
            </div>
            <button type="button" class="ios-chip py-1.5 px-3" data-copy-val="${escapeHtml(c.val.split(' ')[0])}">
              <span class="material-symbols-rounded text-sm">content_copy</span> Copiar
            </button>
          </div>
        `).join('')}
      </div>
      <h4 class="text-xs uppercase tracking-wider text-[var(--text-secondary)] font-semibold mb-2.5 px-1">Abrir Portal Oficial</h4>
      <div class="ios-group">${portaisHtml}</div>
    `;
  }

  async function runProgressiveOsint(alvo, resDiv, btn) {
    await saveHistory('username', alvo);
    lastModuleId = 'osint';
    const categorias = buildOsintTargets(alvo);
    const report = { alvo, resultados: [] };
    let found = 0, notFound = 0;

    resDiv.className = 'min-h-[300px] liquid-card p-6 text-left';
    resDiv.innerHTML = `
      <div class="flex flex-wrap items-center justify-between gap-3 mb-5 pb-4 border-b border-white/10">
        <div>
          <h3 class="font-bold text-lg">Alvo: <span class="text-[#0A84FF]">${escapeHtml(alvo)}</span></h3>
          <p id="osintCounter" class="text-xs text-[var(--text-secondary)] mt-0.5">Verificando com redundância de proxy...</p>
        </div>
        <div class="flex gap-2">
          <button type="button" class="ios-chip" data-export="copy"><span class="material-symbols-rounded text-sm">content_copy</span> Copiar</button>
          <button type="button" class="ios-chip" data-export="download"><span class="material-symbols-rounded text-sm text-[#0A84FF]">verified</span> Assinado</button>
        </div>
      </div>
      ${categorias.map(cat => `
        <div class="mb-5">
          <div class="flex items-center justify-between gap-2 mb-2 px-1">
            <h4 class="text-xs uppercase tracking-wider text-[var(--text-secondary)] font-semibold flex items-center gap-1.5">
              <span class="material-symbols-rounded text-base text-[#0A84FF]">${escapeHtml(cat.icone)}</span> ${escapeHtml(cat.titulo)}
            </h4>
            <a href="${escapeHtml(cat.dorkGeral)}" target="_blank" rel="noopener noreferrer" class="ios-chip text-[11px] py-1 px-2.5">
              <span class="material-symbols-rounded text-xs">manage_search</span> Dork Geral
            </a>
          </div>
          <div class="ios-group">
            ${cat.itens.map(item => `
              <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" class="ios-row">
                <div class="flex flex-col min-w-0">
                  <span class="font-semibold text-sm text-white truncate">${escapeHtml(item.nome)}</span>
                  <span id="info-${escapeHtml(item.id)}" class="text-[11px] text-[var(--text-secondary)] truncate">Checando...</span>
                </div>
                <span id="status-${escapeHtml(item.id)}" class="pill-tag tag-info">
                  <span class="material-symbols-rounded text-xs spinner">refresh</span> Checando
                </span>
              </a>
            `).join('')}
          </div>
        </div>
      `).join('')}
    `;

    const tasks = [];
    for (const cat of categorias) {
      for (const item of cat.itens) {
        tasks.push(item.check().then(res => {
          const pill = document.getElementById(`status-${item.id}`);
          const infoEl = document.getElementById(`info-${item.id}`);
          if (!pill) return;
          if (res.status === 'found') {
            found++;
            pill.className = 'pill-tag tag-ok';
            pill.innerHTML = '<span class="material-symbols-rounded text-xs">check_circle</span> Encontrado';
            infoEl.textContent = res.info || 'Perfil localizado';
          } else if (res.status === 'notfound') {
            notFound++;
            pill.className = 'pill-tag tag-err';
            pill.innerHTML = '<span class="material-symbols-rounded text-xs">cancel</span> Não encontrado';
            infoEl.textContent = 'Sem conta pública';
          } else {
            pill.className = 'pill-tag tag-warn';
            pill.innerHTML = `<span class="material-symbols-rounded text-xs">open_in_new</span> ${escapeHtml(res.label || 'Verificar')}`;
            infoEl.textContent = 'Toque para abrir';
          }
          report.resultados.push({ categoria: cat.titulo, site: item.nome, url: item.url, status: res.status });
          lastResultData = report;
          const c = document.getElementById('osintCounter');
          if (c) c.textContent = `${found} encontrado(s) • ${notFound} não encontrado(s)`;
        }));
      }
    }
    await Promise.allSettled(tasks);
    btn.disabled = false;
    btn.innerHTML = '<span class="material-symbols-rounded text-lg">search</span> Consultar';
  }

  async function handleSearch(e, id) {
    e.preventDefault();
    const m = MODULES.find(x => x.id === id);
    const val = document.getElementById('searchInput').value.trim();
    const btn = e.target.querySelector('button[type="submit"]');
    const resDiv = document.getElementById('result');

    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-rounded spinner text-lg">refresh</span> Consultando...';

    if (m.progressive) { await runProgressiveOsint(val, resDiv, btn); return; }

    resDiv.className = 'min-h-[300px] liquid-card p-6 flex flex-col justify-center items-center text-center';
    resDiv.innerHTML = `
      <span class="material-symbols-rounded spinner text-4xl mb-2 text-[#0A84FF]">refresh</span>
      <p class="text-sm font-medium text-[var(--text-secondary)]">Consultando APIs (com fallback automático)...</p>
    `;

    try {
      const data = await m.fetchApi(val);
      lastResultData = data.raw || data;
      lastModuleId = id;
      if (val) await saveHistory(id, val);

      let html = '';
      if (data.resumo) html += renderIosList(data.resumo);
      if (data.listas?.length) {
        html += data.listas.map(l => `
          <div class="mt-5">
            <h4 class="text-xs uppercase tracking-wider text-[var(--text-secondary)] font-semibold mb-2 px-1">${escapeHtml(l.titulo)} (${l.itens.length})</h4>
            <div class="flex flex-wrap gap-2 max-h-60 overflow-y-auto">
              ${l.itens.map(item => `<span class="text-xs px-3 py-1.5 rounded-full bg-white/10 text-white">${escapeHtml(item)}</span>`).join('')}
            </div>
          </div>
        `).join('');
      }

      resDiv.className = 'min-h-[300px] liquid-card p-6 text-left';
      resDiv.innerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4 pb-3 border-b border-white/10">
          <div>
            <div class="flex items-center gap-2">
              <span class="material-symbols-rounded text-[#30D158] text-2xl">check_circle</span>
              <h3 class="font-bold text-lg">Resultado</h3>
            </div>
            ${data.provider ? `<span class="text-[11px] text-[#0A84FF] font-semibold">Fonte: ${escapeHtml(data.provider)}</span>` : ''}
          </div>
          <div class="flex gap-2">
            <button type="button" class="ios-chip" data-export="copy"><span class="material-symbols-rounded text-sm">content_copy</span> Copiar</button>
            <button type="button" class="ios-chip" data-export="download"><span class="material-symbols-rounded text-sm text-[#0A84FF]">verified</span> Assinado</button>
          </div>
        </div>
        ${html}
      `;
    } catch (err) {
      resDiv.className = 'min-h-[300px] liquid-card p-6 flex flex-col justify-center items-center text-center';
      resDiv.innerHTML = `
        <span class="material-symbols-rounded text-5xl mb-2 text-[#FF453A]">error</span>
        <h3 class="font-bold text-base mb-1">Falha na consulta</h3>
        <p class="text-xs text-[var(--text-secondary)] max-w-md">${escapeHtml(err.message)}</p>
      `;
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-rounded text-lg">search</span> Consultar';
    }
  }

  function renderIosList(obj) {
    const entries = Object.entries(obj).filter(([, v]) => v !== undefined && v !== null && v !== '');
    if (!entries.length) return '<p class="text-sm text-[var(--text-secondary)]">Nenhum dado retornado.</p>';
    return `
      <div class="ios-group">
        ${entries.map(([k, v]) => `
          <div class="ios-row">
            <div class="flex items-center gap-3 min-w-0">
              <span class="material-symbols-rounded text-[#0A84FF] text-xl shrink-0">${escapeHtml(getIcon(k))}</span>
              <div class="flex flex-col min-w-0">
                <span class="text-[11px] uppercase tracking-wider text-[var(--text-secondary)] font-semibold">${escapeHtml(k.replace(/_/g, ' '))}</span>
                <span class="text-sm font-medium text-white break-words">${escapeHtml(v)}</span>
              </div>
            </div>
            <button type="button" class="ios-chip text-[11px] py-1 px-2.5 shrink-0" data-copy-val="${escapeHtml(v)}">
              <span class="material-symbols-rounded text-xs">content_copy</span>
            </button>
          </div>
        `).join('')}
      </div>
    `;
  }

  // ==========================================================
  document.addEventListener('click', async (e) => {
    const navEl = e.target.closest('[data-nav]');
    if (navEl) { navigate(navEl.getAttribute('data-nav')); return; }

    const fillEl = e.target.closest('[data-fill]');
    if (fillEl) {
      const input = document.getElementById('searchInput');
      if (input) { input.value = fillEl.getAttribute('data-fill'); document.getElementById('searchForm')?.requestSubmit(); }
      return;
    }

    const fillAtpv = e.target.closest('[data-fill-atpv]');
    if (fillAtpv) {
      const input = document.getElementById('atpvPlaca');
      if (input) input.value = fillAtpv.getAttribute('data-fill-atpv');
      return;
    }

    const copyVal = e.target.closest('[data-copy-val]');
    if (copyVal) { copyText(copyVal.getAttribute('data-copy-val'), copyVal); return; }

    const expEl = e.target.closest('[data-export]');
    if (expEl && lastResultData) {
      const signed = await P2PLayer.signJson(lastResultData);
      const jsonStr = JSON.stringify(signed, null, 2);
      if (expEl.getAttribute('data-export') === 'copy') {
        copyText(jsonStr, expEl);
      } else {
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `kiik-glassosint-${lastModuleId}-${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
      }
    }
  });

  window.addEventListener('hashchange', render);
  document.addEventListener('DOMContentLoaded', render);
})();
</script>
</body>
</html>
